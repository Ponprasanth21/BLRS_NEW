<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
	<!-- BAJ VERSION 1.0.1  -->
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>BLRS</title>
	<link rel="stylesheet" type="text/css" href="/webjars/bootstrap/4.3.1/css/bootstrap.min.css"
		th:href="@{/webjars/bootstrap/4.3.1/css/bootstrap.min.css}">
	<link rel="stylesheet" type="text/css" href="/webjars/font-awesome/5.9.0/css/all.min.css"
		th:href="@{/webjars/font-awesome/5.9.0/css/all.min.css}">
	<link rel="stylesheet" type="text/css" href="/webjars/jquery-ui/1.12.1/jquery-ui.min.css"
		th:href="@{/webjars/jquery-ui/1.12.1/jquery-ui.min.css}">
	<link rel="stylesheet" type="text/css" href="/webjars/datatables/1.10.19/css/jquery.dataTables.min.css"
		th:href="@{/webjars/datatables/1.10.19/css/jquery.dataTables.min.css}">
	<script src="/webjars/jquery/3.4.1/jquery.min.js" th:src="@{/webjars/jquery/3.4.1/jquery.min.js}"></script>
	<script src="/webjars/jquery-ui/1.12.1/jquery-ui.min.js"
		th:src="@{/webjars/jquery-ui/1.12.1/jquery-ui.min.js}"></script>
	<script src="/webjars/popper.js/1.14.7/umd/popper.min.js"
		th:src="@{/webjars/popper.js/1.14.7/umd/popper.min.js}"></script>
	<script src="/webjars/bootstrap/4.3.1/js/bootstrap.min.js"
		th:src="@{/webjars/bootstrap/4.3.1/js/bootstrap.min.js}"></script>
	<script src="/webjars/datatables/1.10.19/js/jquery.dataTables.min.js"
		th:src="@{/webjars/datatables/1.10.19/js/jquery.dataTables.min.js}"></script>
	<script src="/webjars/datatables/1.10.19/js/dataTables.bootstrap4.min.js"
		th:src="@{/webjars/datatables/1.10.19/js/dataTables.bootstrap4.min.js}"></script>
	<link rel="stylesheet" type="text/css" href="/webjars/chartjs/2.8.0/Chart.min.css"
		th:href="@{/webjars/chartjs/2.8.0/Chart.min.css}">
	<script src="/webjars/chartjs/2.8.0/Chart.min.js" th:src="@{/webjars/chartjs/2.8.0/Chart.min.js}"></script>
	<link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">
	<link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
		body {
			background-color: #f8fafc !important;
			font-family: 'Outfit', sans-serif !important;
			color: #1e293b;
		}
		.container-manager {
			width: 100%;
			max-width: 100%;
			padding-right: 6%;
			padding-left: 6%;
			margin-right: auto;
			margin-left: auto;
			margin-top: 10px;
		}
		.table-card {
			background: #ffffff;
			border: 1px solid rgba(226, 232, 240, 0.8);
			border-radius: 12px;
			padding: 20px;
			box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
			height: 100%;
		}
		.custom-table {
			width: 100%;
			border-collapse: separate;
			border-spacing: 0;
			margin-bottom: 0;
		}
		.custom-table th {
			background: #f8fafc;
			color: #64748b;
			font-size: 0.72rem;
			font-weight: 600;
			text-transform: uppercase;
			letter-spacing: 0.05em;
			padding: 10px 14px;
			border-bottom: 1px solid #e2e8f0;
			border-top: none;
		}
		.custom-table td {
			padding: 10px 14px;
			border-bottom: 1px solid #f1f5f9;
			color: #475569;
			font-size: 0.82rem;
			vertical-align: middle;
		}
		.custom-table tr:hover td { background-color: #f8fafc; }
		.custom-table tr:last-child td { border-bottom: none; }
		.status-badge {
			display: inline-flex;
			align-items: center;
			padding: 2px 8px;
			border-radius: 9999px;
			font-size: 0.72rem;
			font-weight: 600;
		}
		.status-success { background-color: #d1fae5; color: #065f46; }
		.status-warning { background-color: #fef3c7; color: #92400e; }
		.status-danger { background-color: #fee2e2; color: #991b1b; }
		.status-info { background-color: #e0f2fe; color: #075985; }
		.table-responsive::-webkit-scrollbar { width: 6px; height: 6px; }
		.table-responsive::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
		.table-responsive::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
		@media (max-width: 767.98px) {
			.container-manager {
				width: 100%;
				max-width: 100%;
				padding-right: 10px;
				padding-left: 10px;
				margin-top: 25px;
			}
			.container-manager > .row,
			.container-manager .col-sm-11,
			.container-manager .card {
				width: 100%;
				margin-left: 0;
				margin-right: 0;
			}
			.container-manager .card-body {
				padding-left: 15px !important;
				padding-right: 15px !important;
			}
			.container-manager form { max-width: 100% !important; }
			.container-manager fieldset {
				max-width: 100% !important;
				padding-left: 12px !important;
				padding-right: 12px !important;
			}
		}
		@media (max-width: 575.98px) {
			.container-manager { padding-right: 5px; padding-left: 5px; }
			.container-manager .card-footer { padding-left: 5px; padding-right: 5px; }
		}
		html, body {
		    width: 100% !important;
		    margin: 0 !important;
		    overflow-x: hidden !important;
		    overflow-y: visible !important;
		}
	</style>
	<script th:inline="javascript">
		/*<![CDATA[*/
		function home() {
			location.href = './Dashboard';
		}
		function Back() {
			window.history.back();
		}
		/*]]>*/
	</script>
</head>

<body>
	<div th:insert="BLRS_HeaderMenu :: header"></div>
	<div class="container-manager">
		<div class="row d-flex justify-content-center">
			<div class="col-sm-11 mt-2">
				<div th:if="${formmode}=='list'">
					<div class="panel panel-primary filterable">
						<div class="card" style="box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border-radius: 6px; border: 1px solid #cbd5e1;">
							<div class="card-header" style="background-color: #e9ecef;">
								<div class="float-left">
									<h6 style="font-weight: bold; margin: 0;">EMAIL and SMS Parameter</h6>
								</div>
							</div>
							<div class="card-body d-flex flex-column align-items-center" style="padding: 12px 25px; border-top: 1px solid #cbd5e1; border-bottom: 1px solid #cbd5e1;">
								<form id="parameterForm" style="width: 100%; max-width: 500px;" enctype="multipart/form-data" onsubmit="return false;">
									<input type="hidden" name="param_id" value="EMAILSMS">

									<fieldset style="border: 1px solid #cbd5e1; padding: 10px 20px 8px 20px; border-radius: 4px; margin-bottom: 10px; max-width: 500px;">
										<legend style="width: auto; padding: 0 8px; font-size: 0.88rem; font-weight: bold; color: #2563eb; margin-bottom: 4px;">Email</legend>
										<div class="form-group row align-items-center mb-1">
											<label class="col-sm-3 col-form-label font-weight-bold p-0 pl-2" style="font-size: 0.8rem;">Host</label>
											<div class="col-sm-8"><input type="text" class="form-control form-control-sm" name="email_host" id="emailHost" th:value="${EmailSms.email_host}"></div>
										</div>
										<div class="form-group row align-items-center mb-1">
											<label class="col-sm-3 col-form-label font-weight-bold p-0 pl-2" style="font-size: 0.8rem;">Port</label>
											<div class="col-sm-8"><input type="text" class="form-control form-control-sm" name="email_port" id="emailPort" th:value="${EmailSms.email_port}"></div>
										</div>
										<div class="form-group row align-items-center mb-1">
											<label class="col-sm-3 col-form-label font-weight-bold p-0 pl-2" style="font-size: 0.8rem;">Sender Email</label>
											<div class="col-sm-8"><input type="email" class="form-control form-control-sm" name="sender_email" id="senderEmail" th:value="${EmailSms.sender_email}"></div>
										</div>
										<div class="form-group row align-items-center mb-1">
											<label class="col-sm-3 col-form-label font-weight-bold p-0 pl-2" style="font-size: 0.8rem;">Password</label>
											<div class="col-sm-8"><input type="password" class="form-control form-control-sm" name="email_pwd" id="emailPassword" autocomplete="new-password" placeholder="Leave blank to keep current"></div>
										</div>
										<div class="form-group row align-items-center mb-1">
											<label class="col-sm-3 col-form-label font-weight-bold p-0 pl-2" style="font-size: 0.8rem;">Email</label>
											<div class="col-sm-8">
												<select class="form-control form-control-sm custom-select custom-select-sm" name="email_flg" id="emailEnable">
													<option value="N" th:selected="${EmailSms.email_flg != 'Y'}">No</option>
													<option value="Y" th:selected="${EmailSms.email_flg == 'Y'}">Yes</option>
												</select>
											</div>
										</div>
									</fieldset>

									<fieldset style="border: 1px solid #cbd5e1; padding: 10px 20px 8px 20px; border-radius: 4px; margin-bottom: 10px; max-width: 500px;">
										<legend style="width: auto; padding: 0 8px; font-size: 0.88rem; font-weight: bold; color: #2563eb; margin-bottom: 4px;">Signature</legend>
										<div class="form-group row align-items-center mb-1">
											<label class="col-sm-3 col-form-label font-weight-bold p-0 pl-2" style="font-size: 0.8rem;">Auth Id</label>
											<div class="col-sm-8"><input type="text" class="form-control form-control-sm" name="auth_id" id="authId" th:value="${EmailSms.auth_id}"></div>
										</div>
										<div class="form-group row align-items-start mb-1">
											<label class="col-sm-3 col-form-label font-weight-bold p-0 pl-2" style="font-size: 0.8rem;">Footer</label>
											<div class="col-sm-8"><textarea class="form-control form-control-sm" name="footer_text" id="footerText" rows="2" th:text="${EmailSms.footer_text}"></textarea></div>
										</div>
										<div class="form-group row align-items-center mb-1">
											<label class="col-sm-3 col-form-label font-weight-bold p-0 pl-2" style="font-size: 0.8rem;">Signature</label>
											<div class="col-sm-8">
												<div class="input-group input-group-sm">
													<input type="text" class="form-control form-control-sm" id="signatureFileText" th:value="${EmailSms.signature_name}" readonly>
													<div class="input-group-append">
														<label class="btn btn-sm btn-outline-secondary mb-0" style="background-color: #e2e8f0; color: #334155; font-weight: bold; cursor: pointer;">
															Browse...
															<input type="file" name="file" id="signatureFile" accept="image/*" hidden onchange="$('#signatureFileText').val(this.files[0] ? this.files[0].name : '')">
														</label>
													</div>
												</div>
											</div>
										</div>
									</fieldset>

									<fieldset style="border: 1px solid #cbd5e1; padding: 10px 20px 8px 20px; border-radius: 4px; margin-bottom: 5px; max-width: 500px;">
										<legend style="width: auto; padding: 0 8px; font-size: 0.88rem; font-weight: bold; color: #2563eb; margin-bottom: 4px;">SMS</legend>
										<div class="form-group row align-items-center mb-1">
											<label class="col-sm-3 col-form-label font-weight-bold p-0 pl-2" style="font-size: 0.8rem;">Host</label>
											<div class="col-sm-8"><input type="text" class="form-control form-control-sm" name="sms_host" id="smsHost" th:value="${EmailSms.sms_host}"></div>
										</div>
										<div class="form-group row align-items-center mb-1">
											<label class="col-sm-3 col-form-label font-weight-bold p-0 pl-2" style="font-size: 0.8rem;">User</label>
											<div class="col-sm-8"><input type="text" class="form-control form-control-sm" name="sms_user" id="smsUser" th:value="${EmailSms.sms_user}"></div>
										</div>
										<div class="form-group row align-items-center mb-1">
											<label class="col-sm-3 col-form-label font-weight-bold p-0 pl-2" style="font-size: 0.8rem;">Password</label>
											<div class="col-sm-8"><input type="password" class="form-control form-control-sm" name="sms_pwd" id="smsPassword" autocomplete="new-password" placeholder="Leave blank to keep current"></div>
										</div>
										<div class="form-group row align-items-center mb-1">
											<label class="col-sm-3 col-form-label font-weight-bold p-0 pl-2" style="font-size: 0.8rem;">SMS</label>
											<div class="col-sm-8">
												<select class="form-control form-control-sm custom-select custom-select-sm" name="sms_flg" id="smsEnable">
													<option value="N" th:selected="${EmailSms.sms_flg != 'Y'}">No</option>
													<option value="Y" th:selected="${EmailSms.sms_flg == 'Y'}">Yes</option>
												</select>
											</div>
										</div>
									</fieldset>
								</form>
							</div>
							<div class="card-footer text-center border-top-0" style="background-color: #e9ecef;">
								<button type="button" class="btn-primary big-btn" id="btnHome" onclick="home();">Home</button>
								<button type="button" class="btn-primary big-btn" id="btnSubmit">Submit</button>
								<button type="button" class="btn-primary big-btn" id="btnBack" onclick="Back();">Back</button>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script>
		$(function () {
			$("#btnSubmit").on("click", function () {
				if ($("#emailEnable").val() === "Y" && ($("#emailHost").val() === "" || $("#senderEmail").val() === "")) {
					alert("Enter the email host and sender email to enable Email.");
					return;
				}
				$.ajax({
					url: "saveEmailSms",
					type: "POST",
					data: new FormData(document.getElementById("parameterForm")),
					processData: false,
					contentType: false,
					success: function (res) { alert(res); location.reload(); },
					error: function () { alert("Parameters could not be saved."); }
				});
			});
		});
	</script>
</body>
</html>
