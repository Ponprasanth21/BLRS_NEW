<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
	<!-- BAJ VERSION 1.0.1 -->
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>BLRS</title>

	<link rel="stylesheet" type="text/css" href="/webjars/bootstrap/4.3.1/css/bootstrap.min.css"
		th:href="@{/webjars/bootstrap/4.3.1/css/bootstrap.min.css}">
	<link rel="stylesheet" type="text/css" href="/webjars/font-awesome/5.9.0/css/all.min.css"
		th:href="@{/webjars/font-awesome/5.9.0/css/all.min.css}">
	<link rel="stylesheet" type="text/css" href="/webjars/jquery-ui/1.12.1/jquery-ui.min.css"
		th:href="@{/webjars/jquery-ui/1.12.1/jquery-ui.min.css}">
	<link rel="stylesheet" type="text/css" href="/webjars/datatables/1.10.19/css/jquery.dataTables.min.css"
		th:href="@{/webjars/datatables/1.10.19/css/jquery.dataTables.min.css}">

	<script src="/webjars/jquery/3.4.1/jquery.min.js" th:src="@{/webjars/jquery/3.4.1/jquery.min.js}"></script>
	<script src="/webjars/jquery-ui/1.12.1/jquery-ui.min.js"
		th:src="@{/webjars/jquery-ui/1.12.1/jquery-ui.min.js}"></script>
	<script src="/webjars/popper.js/1.14.7/umd/popper.min.js"
		th:src="@{/webjars/popper.js/1.14.7/umd/popper.min.js}"></script>
	<script src="/webjars/bootstrap/4.3.1/js/bootstrap.min.js"
		th:src="@{/webjars/bootstrap/4.3.1/js/bootstrap.min.js}"></script>
	<script src="/webjars/datatables/1.10.19/js/jquery.dataTables.min.js"
		th:src="@{/webjars/datatables/1.10.19/js/jquery.dataTables.min.js}"></script>
	<script src="/webjars/datatables/1.10.19/js/dataTables.bootstrap4.min.js"
		th:src="@{/webjars/datatables/1.10.19/js/dataTables.bootstrap4.min.js}"></script>

	<link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">
	<link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">

	<style>
		@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

		/* ===== Common layout (same on Reminder Generation and Batch Job Execution) ===== */
		html,
		body {
			height: 100%;
		}

		body {
			background-color: #f8fafc !important;
			font-family: 'Outfit', sans-serif !important;
			color: #1e293b;
			overscroll-behavior: none !important;
			margin: 0;
			padding-top: 70px;
			overflow-x: hidden;
		}

		.container-manager {
			width: 100%;
			max-width: 100%;
			padding: 0 1.9%;
			margin: 10px auto 15px;
			box-sizing: border-box;
		}

		/* one card: fixed header, scrolling body, fixed footer */
		.page-card {
			display: flex;
			flex-direction: column;
			width: 100%;
			background: #fff;
			border: 1px solid #cbd5e1;
			border-radius: 6px;
			box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
			height: calc(100vh - 110px);
			min-height: 320px;
			overflow: hidden;
		}

		.page-card-header {
			flex: 0 0 auto;
			display: flex;
			justify-content: space-between;
			align-items: center;
			background: #e9ecef;
			padding: 10px 16px;
			border-bottom: 1px solid #cbd5e1;
		}

		.page-card-header h6 {
			margin: 0;
			font-weight: 600;
			text-transform: uppercase;
			letter-spacing: 0.02em;
		}

		.page-card-body {
			flex: 1 1 auto;
			overflow: auto;
			padding: 0;
		}

		.page-card-footer {
			flex: 0 0 auto;
			background: #e9ecef;
			text-align: center;
			padding: 8px;
			border-top: 1px solid #cbd5e1;
		}

		/* table */
		.data-table {
			width: 100% !important;
			margin: 0 !important;
			font-size: 0.83rem;
			border-collapse: separate;
			border-spacing: 0;
		}

		.data-table thead th {
			position: sticky;
			top: 0;
			z-index: 2;
			background: #f1f5f9;
			color: #334155;
			font-weight: 700;
			border-bottom: 2px solid #cbd5e1 !important;
			white-space: nowrap;
			vertical-align: middle;
		}

		.data-table td {
			vertical-align: middle;
			white-space: nowrap;
		}

		.data-table td.wrap {
			white-space: normal;
		}

		/* DataTables controls */
		.dataTables_wrapper {
			padding: 8px 12px 0;
			font-size: 0.83rem;
		}

		.dataTables_wrapper .dataTables_filter input,
		.dataTables_wrapper .dataTables_length select {
			border: 1px solid #cbd5e1;
			border-radius: 4px;
			padding: 2px 6px;
		}

		/* buttons */
		.btn-primary {
			background-color: #007bff !important;
			border-color: #007bff !important;
			color: #fff !important;
		}

		.btn-primary:hover {
			background-color: #0069d9 !important;
			border-color: #0062cc !important;
		}

		.big-btn {
			padding: 4px 14px;
			font-size: 0.85rem;
			border-radius: 4px;
			border: 1px solid #007bff;
			cursor: pointer;
		}

		@media (max-width: 767.98px) {
			.container-manager {
				padding: 0 10px;
			}

			.page-card {
				height: calc(100vh - 100px);
			}
		}
	</style>
	<script>
		var table = null;

		$(function () {
			if ($('#reminderGenTable tbody tr').length > 0) {
				table = $('#reminderGenTable').DataTable({
					pageLength: 25,
					lengthMenu: [10, 25, 50, 100],
					order: [],
					columnDefs: [{orderable: false, targets: 0}]
				});
			}
		});

		function checkedBoxes() {
			return table ? table.$('input[name="selectedReminders"]:checked') : $();
		}

		function toggleSelectAll(src) {
			if (!table) return;
			table.rows({search: 'applied'}).nodes().to$()
				.find('input[name="selectedReminders"]').prop('checked', src.checked);
		}

		function openDialog() {
			if (checkedBoxes().length === 0) {
				alert('Please select at least one account.');
				return;
			}
			$('#reminderModal').modal('show');
		}

		// Admin > Parameters > Reminder rules for the selected reminder type
		function applyReminderRules() {
			var o = $('#reminderType option:selected');
			var allowDownload = o.data('download') === 'Y';
			$('#email').val('NO').prop('disabled', o.data('email') !== 'Y');
			$('#sms').val('NO').prop('disabled', o.data('sms') !== 'Y');
			$('#btnSubmitReminder').prop('disabled', !!o.val() && !allowDownload);
			if (o.val() && !allowDownload) alert('File download is not allowed for this reminder type.');
		}

		function submitReminder() {
			if (!$('#reminderType').val()) {
				alert('Please select the reminder type.');
				return;
			}
			$('#email, #sms').prop('disabled', false); // disabled fields are not posted
			var form = document.getElementById('reminderForm');
			$(form).find('input.hid-sel').remove();
			checkedBoxes().each(function () {
				$('<input type="hidden" class="hid-sel" name="selectedReminders">').val(this.value).appendTo(form);
			});
			form.submit();
			setTimeout(function () {$('#reminderModal').modal('hide');}, 800);
		}
	</script>
</head>

<body>
	<div th:insert="BLRS_HeaderMenu :: header"></div>

	<div class="container-manager">
		<div th:if="${formmode}=='list'">
			<div class="page-card">

				<div class="page-card-header">
					<h6>Reminder Generator</h6>
					<button type="button" class="btn-primary big-btn" id="btnFileGenerate" onclick="openDialog();">File
						Generate</button>
				</div>

				<div class="page-card-body">
					<table class="table table-bordered table-striped table-hover data-table" id="reminderGenTable"
						th:if="${reminders != null and !#lists.isEmpty(reminders)}">
						<thead>
							<tr>
								<th style="width: 40px; text-align: center;"><input type="checkbox" title="Select all"
										onclick="toggleSelectAll(this)"></th>
								<th>Scheme Code</th>
								<th>Customer ID</th>
								<th>Account Number</th>
								<th>Name of Borrower</th>
								<th class="text-right">Overdue</th>
								<th>Department</th>
								<th>Reminder Sent</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="rem : ${reminders}">
								<td class="text-center"><input type="checkbox" name="selectedReminders"
										th:value="${rem.acct_num}"></td>
								<td th:text="${rem.schem_code}"></td>
								<td th:text="${rem.cust_id}"></td>
								<td th:text="${rem.acct_num}"></td>
								<td class="wrap" th:text="${rem.acct_name}"></td>
								<td class="text-right"
									th:text="${rem.overdue != null} ? ${#numbers.formatDecimal(rem.overdue, 1, 'COMMA', 2, 'POINT')} : '0.00'">
								</td>
								<td th:text="${rem.dept}"></td>
								<td th:text="${rem.rem_send}"></td>
							</tr>
						</tbody>
					</table>
					<div class="text-center text-muted py-4" th:if="${reminders == null or #lists.isEmpty(reminders)}">
						No records found</div>
				</div>

				<div class="page-card-footer">
					<button type="button" class="btn-primary big-btn" id="btnHome"
						onclick="location.href='./Dashboard';">Home</button>
					<button type="button" class="btn-primary big-btn" id="btnBack"
						onclick="window.history.back();">Back</button>
				</div>

			</div>
		</div>
	</div>

	<!-- Reminder type dialog -->
	<form id="reminderForm" th:action="@{/generateReminderFile}" method="post">
		<!-- <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/> -->
		<div class="modal fade" id="reminderModal" tabindex="-1" role="dialog" aria-hidden="true">
			<div class="modal-dialog modal-dialog-centered" role="document">
				<div class="modal-content">
					<div class="modal-header py-2">
						<h6 class="modal-title">Generate reminder file</h6>
						<button type="button" class="close" data-dismiss="modal" aria-label="Close">&#215;</button>
					</div>
					<div class="modal-body">
						<div class="alert alert-warning py-1 d-none" id="downloadMsg">File download is not allowed for
							this reminder type.</div>
						<div class="form-group row">
							<label class="col-4 col-form-label font-weight-bold" for="reminderType">Reminder
								Type</label>
							<div class="col-8">
								<select class="form-control form-control-sm" name="reminderType" id="reminderType" onchange="applyReminderRules()">
									<option value="">Select</option>
									
									<option th:each="p : ${ReminderParams}"
									        th:value="${p.reminder_no}"
									        th:text="${p.reminder_no}"
									        th:attr="data-download=${p.download_flg},data-email=${p.email_flg},data-sms=${p.sms_flg}">
									</option>
									
								</select>
							</div>
						</div>
						<div class="form-group row">
							<label class="col-4 col-form-label font-weight-bold" for="email">E-mail</label>
							<div class="col-8">
								<select class="form-control form-control-sm" name="email" id="email">
									<option value="NO" selected>No</option>
									<option value="YES">Yes</option>
								</select>
							</div>
						</div>
						<div class="form-group row mb-0">
							<label class="col-4 col-form-label font-weight-bold" for="sms">SMS</label>
							<div class="col-8">
								<select class="form-control form-control-sm" name="sms" id="sms">
									<option value="NO" selected>No</option>
									<option value="YES">Yes</option>
								</select>
							</div>
						</div>
					</div>
					<div class="modal-footer py-2">
						<button type="button" class="btn-primary big-btn" id="btnSubmitReminder"
							onclick="submitReminder();">Submit</button>
						<button type="button" class="btn btn-secondary btn-sm" data-dismiss="modal">Close</button>
					</div>
				</div>
			</div>
		</div>
	</form>
</body>

</html>
