<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
	<!-- BAJ VERSION 1.0.1 -->
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>BLRS</title>

	<link rel="stylesheet" type="text/css" href="/webjars/bootstrap/4.3.1/css/bootstrap.min.css" th:href="@{/webjars/bootstrap/4.3.1/css/bootstrap.min.css}">
	<link rel="stylesheet" type="text/css" href="/webjars/font-awesome/5.9.0/css/all.min.css" th:href="@{/webjars/font-awesome/5.9.0/css/all.min.css}">
	<link rel="stylesheet" type="text/css" href="/webjars/jquery-ui/1.12.1/jquery-ui.min.css" th:href="@{/webjars/jquery-ui/1.12.1/jquery-ui.min.css}">
	<link rel="stylesheet" type="text/css" href="/webjars/datatables/1.10.19/css/jquery.dataTables.min.css" th:href="@{/webjars/datatables/1.10.19/css/jquery.dataTables.min.css}">

	<script src="/webjars/jquery/3.4.1/jquery.min.js" th:src="@{/webjars/jquery/3.4.1/jquery.min.js}"></script>
	<script src="/webjars/jquery-ui/1.12.1/jquery-ui.min.js" th:src="@{/webjars/jquery-ui/1.12.1/jquery-ui.min.js}"></script>
	<script src="/webjars/popper.js/1.14.7/umd/popper.min.js" th:src="@{/webjars/popper.js/1.14.7/umd/popper.min.js}"></script>
	<script src="/webjars/bootstrap/4.3.1/js/bootstrap.min.js" th:src="@{/webjars/bootstrap/4.3.1/js/bootstrap.min.js}"></script>
	<script src="/webjars/datatables/1.10.19/js/jquery.dataTables.min.js" th:src="@{/webjars/datatables/1.10.19/js/jquery.dataTables.min.js}"></script>
	<script src="/webjars/datatables/1.10.19/js/dataTables.bootstrap4.min.js" th:src="@{/webjars/datatables/1.10.19/js/dataTables.bootstrap4.min.js}"></script>

	<link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">
	<link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">

	<style>
		@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

		/* ===== Common layout (same on Reminder Generation and Batch Job Execution) ===== */
		html, body { height: 100%; }
		body { background-color: #f8fafc !important; font-family: 'Outfit', sans-serif !important; color: #1e293b;
			overscroll-behavior: none !important; margin: 0; padding-top: 70px; overflow-x: hidden; }

		.container-manager { width: 100%; max-width: 100%; padding: 0 1.8%; margin: 12px auto 15px; box-sizing: border-box; margin-top: 20px;}

		/* one card: fixed header, scrolling body, fixed footer */
		.page-card { display: flex; flex-direction: column; width: 100%; background: #fff;
			border: 1px solid #cbd5e1; border-radius: 6px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
			height: calc(100vh - 140px); min-height: 320px; overflow: hidden; }
		.page-card-header { flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center;
			background: #e9ecef; padding: 10px 16px; border-bottom: 1px solid #cbd5e1; }
		.page-card-header h6 { margin: 0; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; }
		.page-card-body { flex: 1 1 auto; overflow: auto; padding: 0; }
		.page-card-footer { flex: 0 0 auto; background: #e9ecef; text-align: center; padding: 8px; margin-bottom: 30px;
			border-top: 1px solid #cbd5e1;	margin: 0; }

		/* table */
		.data-table { width: 100% !important; margin: 0 !important; font-size: 0.83rem; border-collapse: separate; border-spacing: 0; }
		.data-table thead th { position: sticky; top: 0; z-index: 2; background: #f1f5f9; color: #334155; padding: 7px 9px !important;
			font-weight: 700; border-bottom: 2px solid #cbd5e1 !important; white-space: nowrap; vertical-align: middle; }
		.data-table td { vertical-align: middle; white-space: nowrap;  }
		.data-table td.wrap { white-space: normal; }

		/* Reduce table row height */
		.data-table tbody td {
			padding: 6px 12px !important;
			line-height: 1.2 !important;
		}


		/* DataTables controls */
		.dataTables_wrapper { padding: 8px 12px 0; font-size: 0.83rem; }
		.dataTables_wrapper .dataTables_filter input, .dataTables_wrapper .dataTables_length select {
			border: 1px solid #cbd5e1; border-radius: 4px; padding: 2px 6px; }

		/* buttons */
		.btn-primary { background-color: #007bff !important; border-color: #007bff !important; color: #fff !important; }
		.btn-primary:hover { background-color: #0069d9 !important; border-color: #0062cc !important; }
		.big-btn { padding: 4px 14px; font-size: 0.85rem; border-radius: 4px; border: 1px solid #007bff; cursor: pointer; }

		@media (max-width: 767.98px) {
			.container-manager { padding: 0 10px; }
			.page-card { height: calc(100vh - 100px); }
		}
		
		#batchExecutionTable tbody .btn {
		    padding: 2px 6px !important;
		    font-size: 11px !important;
		}
		

		#batchExecutionTable thead th,
		#batchExecutionTable tbody td {
		    padding-left: 12px !important;
		    padding-right: 12px !important;
		}

	</style>
	<script>
		$(function () {
			if ($('#batchExecutionTable tbody tr[data-row]').length > 0) {
				$('#batchExecutionTable').DataTable({
					pageLength: 25,
					lengthChange: false, // Hide "Show 25 entries"
					lengthMenu: [10, 25, 50, 100],
					order: [],
					columnDefs: [{ orderable: false, targets: 5 }]
				});
			}
		});

		function runJob(jobId) {
			if (!confirm('Run job ' + jobId + ' now?')) return;
			alert('Please do not reload the page until the job status is displayed.');
			$('button.run-btn').prop('disabled', true);

			$.post('runBatchJob', { job_id: jobId })
				.done(function (msg) {
					alert(msg);
					location.reload();
				})
				.fail(function () {
					alert('Job could not be started. Please try again.');
					$('button.run-btn').prop('disabled', false);
				});
		}
	</script>
</head>

<body>
	<div th:insert="BLRS_HeaderMenu :: header"></div>

	<div class="container-manager">
		<div th:if="${formmode}=='list'">
			<div class="page-card">

				<div class="page-card-header">
					<h6>Batch Job Execution</h6>
				</div>

				<div class="page-card-body">
					<table class="table table-bordered table-striped table-hover data-table" id="batchExecutionTable"
						th:if="${batchExecutions != null and !#lists.isEmpty(batchExecutions)}">
						<thead>
							<tr>
								<th>Job Id</th>
								<th>Job Name</th>
								<th>Last Run Date</th>
								<th>Next Run Date</th>
								<th>Status</th>
								<th class="text-center" style="width: 100px;">Action</th>
							</tr>
						</thead>
						<tbody>
							<!-- Getter names must match BLRS_BatchJobScheduler_Entity
							     (getJob_id() -> job.job_id ; getJobId() -> job.jobId) -->
							<tr th:each="job : ${batchExecutions}" data-row="1">
								<td th:text="${job.job_id}"></td>
								<td class="wrap" th:text="${job.job_name}"></td>
								<td th:text="${job.last_run_date}"></td>
								<td th:text="${job.next_run_date}"></td>
								<td th:text="${job.status}"></td>
								<td class="text-center">
									<button type="button" class="btn btn-primary btn-sm px-3 run-btn"
										th:attr="data-job=${job.job_id}" onclick="runJob(this.dataset.job);">Run</button>
								</td>
							</tr>
						</tbody>
					</table>
					<div class="text-center text-muted py-4" th:if="${batchExecutions == null or #lists.isEmpty(batchExecutions)}">No batch jobs found</div>

					<!-- Recent Execution Logs & Excel Status Downloads -->
					<div th:if="${recentExecutions != null and !#lists.isEmpty(recentExecutions)}" class="mt-3 p-3" style="background: #f8fafc; border-top: 2px solid #cbd5e1;">
						<div class="d-flex justify-content-between align-items-center mb-2">
							<h6 class="font-weight-bold text-uppercase mb-0" style="font-size: 12px; color: #334155;">
								<i class="fas fa-history text-primary mr-1"></i> Recent Execution Logs &amp; Status Reports
							</h6>
							<span class="badge badge-secondary" th:text="${#lists.size(recentExecutions) + ' executions recorded'}">0 executions</span>
						</div>
						<div class="table-responsive" style="max-height: 220px; overflow-y: auto;">
							<table class="table table-sm table-bordered table-hover mb-0" style="font-size: 11.5px; background: #fff;">
								<thead class="thead-light">
									<tr>
										<th>Execution ID</th>
										<th>Job ID</th>
										<th>Job Name</th>
										<th>Run Date</th>
										<th>Start Time</th>
										<th>End Time</th>
										<th>Status</th>
										<th>Records</th>
										<th>Success</th>
										<th>Failed</th>
										<th>Status Report</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="exec : ${recentExecutions}">
										<td class="font-weight-bold" th:text="${exec.executionId}"></td>
										<td th:text="${exec.jobId}"></td>
										<td class="wrap" th:text="${exec.jobName}"></td>
										<td th:text="${#dates.format(exec.runDate, 'dd-MM-yyyy')}"></td>
										<td th:text="${#dates.format(exec.startTime, 'dd-MM-yyyy HH:mm:ss')}"></td>
										<td th:text="${exec.endTime != null ? #dates.format(exec.endTime, 'dd-MM-yyyy HH:mm:ss') : '-'}"></td>
										<td>
											<span th:class="${exec.status == 'COMPLETED' ? 'badge badge-success' : (exec.status == 'FAILED' ? 'badge badge-danger' : 'badge badge-warning')}"
												th:text="${exec.status}"></span>
										</td>
										<td th:text="${exec.totalRecords}"></td>
										<td class="text-success font-weight-bold" th:text="${exec.successCount}"></td>
										<td class="text-danger font-weight-bold" th:text="${exec.failureCount}"></td>
										<td class="text-center">
											<a th:if="${exec.statusFilePath != null}"
												th:href="@{./downloadJobStatusExcel(executionId=${exec.executionId})}"
												class="btn btn-xs btn-outline-success py-0 px-2" style="font-size: 11px;" title="Download Excel Status File">
												<i class="fas fa-file-excel mr-1"></i> Download .xls
											</a>
											<span th:if="${exec.statusFilePath == null}" class="text-muted">-</span>
										</td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>
				</div>

					<div class="page-card-footer">
						<button type="button" class="btn-primary big-btn" id="btnHome" onclick="location.href='./Dashboard';">Home</button>
						<button type="button" class="btn-primary big-btn" id="btnBack" onclick="window.history.back();">Back</button>
					</div>

			</div>
		</div>
	</div>
</body>
</html>
