<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>BLRS - Reminder Parameter</title>
	<link rel="stylesheet" type="text/css" href="/webjars/bootstrap/4.3.1/css/bootstrap.min.css"
		th:href="@{/webjars/bootstrap/4.3.1/css/bootstrap.min.css}">
	<link rel="stylesheet" type="text/css" href="/webjars/font-awesome/5.9.0/css/all.min.css"
		th:href="@{/webjars/font-awesome/5.9.0/css/all.min.css}">
	<script src="/webjars/jquery/3.4.1/jquery.min.js" th:src="@{/webjars/jquery/3.4.1/jquery.min.js}"></script>
	<script src="/webjars/bootstrap/4.3.1/js/bootstrap.min.js"
		th:src="@{/webjars/bootstrap/4.3.1/js/bootstrap.min.js}"></script>
	<link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">
	<link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

		body {
			background-color: #f8fafc !important;
			font-family: 'Outfit', sans-serif !important;
			color: #1e293b;
			overscroll-behavior: none !important;
		}

		.container-manager {
			width: 100%;
			max-width: 100%;
			padding-right: 2%;
			padding-left: 2%;
			margin: 11px auto 0;
		}

		.radio-option {
			display: inline-flex;
			align-items: center;
			margin-right: 18px;
			cursor: pointer;
			font-size: 0.85rem;
		}

		.radio-option input[type="radio"] {
			margin-right: 6px;
		}
	</style>
</head>

<body>
	<div th:insert="BLRS_HeaderMenu :: header"></div>
	<div class="container-manager">
		<div class="row d-flex justify-content-center">
			<div class="col-sm-12 mt-2">
				<div th:if="${formmode}=='list'">
					<div class="panel panel-primary filterable">
						<div class="card" style="box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
                                                 border-radius: 6px; border: 1px solid #cbd5e1;">

							<div class="card-header" style="background-color: #e9ecef;">
								<div class="float-left">
									<h6 style="font-weight: bold; margin: 0;">Reminder Parameter</h6>
								</div>
							</div>

							<div class="card-body d-flex flex-column align-items-center" style="padding: 20px 35px; border-top: 1px solid #cbd5e1;
                                        border-bottom: 1px solid #cbd5e1;">
								<form id="reminderParameterForm" style="width: 100%; max-width: 600px;"
									onsubmit="return false;">

									<fieldset th:each="r : ${ReminderList}" style="border: 1px solid #cbd5e1; padding: 12px 25px;
                                                     border-radius: 4px; margin-bottom: 16px; max-width: 600px;">
										<legend style="width: auto; padding: 0 8px; font-size: 0.88rem;
                                                       font-weight: bold; color: #2563eb;">
											<span
												th:text="'Reminder-' + ${#strings.replace(r.reminder_no, 'REM', '')}">Reminder-1</span>
										</legend>

										<div class="row">
											<div class="col-sm-6">
												<div class="form-group row align-items-center mb-2">
													<label class="col-sm-5 col-form-label font-weight-bold p-0 pl-2"
														style="font-size: 0.82rem;">Download</label>
													<div class="col-sm-7 d-flex align-items-center">
														<label class="radio-option mb-0">
															<input type="radio" th:name="'download_' + ${r.reminder_no}"
																value="Y" th:checked="${r.download_flg == 'Y'}"> Y
														</label>
														<label class="radio-option mb-0">
															<input type="radio" th:name="'download_' + ${r.reminder_no}"
																value="N" th:checked="${r.download_flg != 'Y'}"> N
														</label>
													</div>
												</div>
												<div class="form-group row align-items-center mb-0">
													<label class="col-sm-5 col-form-label font-weight-bold p-0 pl-2"
														style="font-size: 0.82rem;">Signature</label>
													<div class="col-sm-7 d-flex align-items-center">
														<label class="radio-option mb-0">
															<input type="radio"
																th:name="'signature_' + ${r.reminder_no}" value="Y"
																th:checked="${r.signature_flg == 'Y'}"> Y
														</label>
														<label class="radio-option mb-0">
															<input type="radio"
																th:name="'signature_' + ${r.reminder_no}" value="N"
																th:checked="${r.signature_flg != 'Y'}"> N
														</label>
													</div>
												</div>
											</div>

											<div class="col-sm-6">
												<div class="form-group row align-items-center mb-2">
													<label class="col-sm-4 col-form-label font-weight-bold p-0 pl-2"
														style="font-size: 0.82rem;">Email</label>
													<div class="col-sm-8 d-flex align-items-center">
														<label class="radio-option mb-0">
															<input type="radio" th:name="'email_' + ${r.reminder_no}"
																value="Y" th:checked="${r.email_flg == 'Y'}"> Y
														</label>
														<label class="radio-option mb-0">
															<input type="radio" th:name="'email_' + ${r.reminder_no}"
																value="N" th:checked="${r.email_flg != 'Y'}"> N
														</label>
													</div>
												</div>
												<div class="form-group row align-items-center mb-0">
													<label class="col-sm-4 col-form-label font-weight-bold p-0 pl-2"
														style="font-size: 0.82rem;">SMS</label>
													<div class="col-sm-8 d-flex align-items-center">
														<label class="radio-option mb-0">
															<input type="radio" th:name="'sms_' + ${r.reminder_no}"
																value="Y" th:checked="${r.sms_flg == 'Y'}"> Y
														</label>
														<label class="radio-option mb-0">
															<input type="radio" th:name="'sms_' + ${r.reminder_no}"
																value="N" th:checked="${r.sms_flg != 'Y'}"> N
														</label>
													</div>
												</div>
											</div>
										</div>
									</fieldset>

								</form>
							</div>

							<div class="card-footer text-center" style="padding: 6px 10px; gap: 4px;">
								<button type="button" class="btn btn-sm btn-primary" id="btnHome"
									onclick="home();">Home</button>
								<button type="button" class="btn btn-sm btn-primary" id="btnSubmit"
									onclick="submitReminders();">Submit</button>
								<button type="button" class="btn btn-sm btn-primary" id="btnBack"
									onclick="Back();">Back</button>
							</div>

						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script>
		function home() {location.href = './Dashboard';}
		function Back() {window.history.back();}

		function submitReminders() {
			var data = {};
			$('#reminderParameterForm').find('input[type=radio]:checked').each(function () {
				data[this.name] = $(this).val();
			});

			$.ajax({
				url: 'saveReminderParam',
				type: 'POST',
				data: data,
				success: function (res) {alert(res); location.reload();},
				error: function () {alert('Reminder parameters could not be saved.');}
			});
		}
	</script>
</body>

</html>
