<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>BLRS - Reminder Parameter</title>

	<link rel="stylesheet" type="text/css" href="/webjars/bootstrap/4.3.1/css/bootstrap.min.css"
		th:href="@{/webjars/bootstrap/4.3.1/css/bootstrap.min.css}">
	<link rel="stylesheet" type="text/css" href="/webjars/font-awesome/5.9.0/css/all.min.css"
		th:href="@{/webjars/font-awesome/5.9.0/css/all.min.css}">
	<link rel="stylesheet" type="text/css" href="/webjars/jquery-ui/1.12.1/jquery-ui.min.css"
		th:href="@{/webjars/jquery-ui/1.12.1/jquery-ui.min.css}">

	<script src="/webjars/jquery/3.4.1/jquery.min.js" th:src="@{/webjars/jquery/3.4.1/jquery.min.js}"></script>
	<script src="/webjars/jquery-ui/1.12.1/jquery-ui.min.js"
		th:src="@{/webjars/jquery-ui/1.12.1/jquery-ui.min.js}"></script>
	<script src="/webjars/popper.js/1.14.7/umd/popper.min.js"
		th:src="@{/webjars/popper.js/1.14.7/umd/popper.min.js}"></script>
	<script src="/webjars/bootstrap/4.3.1/js/bootstrap.min.js"
		th:src="@{/webjars/bootstrap/4.3.1/js/bootstrap.min.js}"></script>

	<link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">
	<link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">

	<style>
		@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

		body {
			background-color: #f8fafc !important;
			font-family: 'Outfit', sans-serif !important;
			color: #1e293b;
		}

		.container-manager {
			width: 83.5%;
			padding-right: 15px;
			padding-left: 15px;
			margin-right: auto;
			margin-left: 16% !important;
			margin-top: 80px;
		}

		.radio-option {
			display: inline-flex;
			align-items: center;
			margin-right: 18px;
			cursor: pointer;
			font-size: 0.85rem;
		}

		.radio-option input[type="radio"] {
			margin-right: 6px;
		}
	</style>

	<script th:inline="javascript">
		/*<![CDATA[*/
		function home() {
			location.href = './Dashboard';
		}

		function Back() {
			window.history.back();
		}

		function submitForm() {
			alert("Reminder parameters saved successfully!");
		}
		/*]]>*/
	</script>
</head>

<body>
	<div th:insert="BLRS_HeaderMenu :: header"></div>

	<div class="container-manager">
		<div class="row d-flex justify-content-center">
			<div class="col-sm-11 mt-2">

				<div th:if="${formmode}=='list'">
					<div class="panel panel-primary filterable">
						<div class="card" style="box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border-radius: 6px; border: 1px solid #cbd5e1;">
							<!-- Card Header -->
							<div class="card-header" style="background-color: #e9ecef;">
								<div class="float-left">
									<h6 style="font-weight: bold; margin: 0;">Reminder Parameter</h6>
								</div>
							</div>

							<!-- Card Body -->
							<div class="card-body d-flex flex-column align-items-center" style="padding: 20px 35px; overflow: hidden; border-top: 1px solid #cbd5e1; border-bottom: 1px solid #cbd5e1;">
								<form id="reminderParameterForm" style="width: 100%; max-width: 600px;" onsubmit="event.preventDefault(); submitForm();">

									<!-- Fieldset 1: Reminder-1 -->
									<fieldset style="border: 1px solid #cbd5e1; padding: 12px 25px 12px 25px; border-radius: 4px; margin-bottom: 16px; max-width: 600px;">
										<legend style="width: auto; padding: 0 8px; font-size: 0.88rem; font-weight: bold; color: #2563eb; margin-bottom: 6px;">Reminder-1</legend>

										<div class="row">
											<!-- Left Column -->
											<div class="col-sm-6">
												<div class="form-group row align-items-center mb-2">
													<label class="col-sm-5 col-form-label font-weight-bold p-0 pl-2" style="font-size: 0.82rem;">Download</label>
													<div class="col-sm-7 d-flex align-items-center">
														<label class="radio-option mb-0"><input type="radio" name="rem1Download" value="Y" checked> Y</label>
														<label class="radio-option mb-0"><input type="radio" name="rem1Download" value="N"> N</label>
													</div>
												</div>
												<div class="form-group row align-items-center mb-0">
													<label class="col-sm-5 col-form-label font-weight-bold p-0 pl-2" style="font-size: 0.82rem;">Signature</label>
													<div class="col-sm-7 d-flex align-items-center">
														<label class="radio-option mb-0"><input type="radio" name="rem1Signature" value="Y" checked> Y</label>
														<label class="radio-option mb-0"><input type="radio" name="rem1Signature" value="N"> N</label>
													</div>
												</div>
											</div>

											<!-- Right Column -->
											<div class="col-sm-6">
												<div class="form-group row align-items-center mb-2">
													<label class="col-sm-4 col-form-label font-weight-bold p-0 pl-2" style="font-size: 0.82rem;">Email</label>
													<div class="col-sm-8 d-flex align-items-center">
														<label class="radio-option mb-0"><input type="radio" name="rem1Email" value="Y" checked> Y</label>
														<label class="radio-option mb-0"><input type="radio" name="rem1Email" value="N"> N</label>
													</div>
												</div>
												<div class="form-group row align-items-center mb-0">
													<label class="col-sm-4 col-form-label font-weight-bold p-0 pl-2" style="font-size: 0.82rem;">SMS</label>
													<div class="col-sm-8 d-flex align-items-center">
														<label class="radio-option mb-0"><input type="radio" name="rem1SMS" value="Y" checked> Y</label>
														<label class="radio-option mb-0"><input type="radio" name="rem1SMS" value="N"> N</label>
													</div>
												</div>
											</div>
										</div>
									</fieldset>

									<!-- Fieldset 2: Reminder-2 -->
									<fieldset style="border: 1px solid #cbd5e1; padding: 12px 25px 12px 25px; border-radius: 4px; margin-bottom: 16px; max-width: 600px;">
										<legend style="width: auto; padding: 0 8px; font-size: 0.88rem; font-weight: bold; color: #2563eb; margin-bottom: 6px;">Reminder-2</legend>

										<div class="row">
											<!-- Left Column -->
											<div class="col-sm-6">
												<div class="form-group row align-items-center mb-2">
													<label class="col-sm-5 col-form-label font-weight-bold p-0 pl-2" style="font-size: 0.82rem;">Download</label>
													<div class="col-sm-7 d-flex align-items-center">
														<label class="radio-option mb-0"><input type="radio" name="rem2Download" value="Y" checked> Y</label>
														<label class="radio-option mb-0"><input type="radio" name="rem2Download" value="N"> N</label>
													</div>
												</div>
												<div class="form-group row align-items-center mb-0">
													<label class="col-sm-5 col-form-label font-weight-bold p-0 pl-2" style="font-size: 0.82rem;">Signature</label>
													<div class="col-sm-7 d-flex align-items-center">
														<label class="radio-option mb-0"><input type="radio" name="rem2Signature" value="Y" checked> Y</label>
														<label class="radio-option mb-0"><input type="radio" name="rem2Signature" value="N"> N</label>
													</div>
												</div>
											</div>

											<!-- Right Column -->
											<div class="col-sm-6">
												<div class="form-group row align-items-center mb-2">
													<label class="col-sm-4 col-form-label font-weight-bold p-0 pl-2" style="font-size: 0.82rem;">Email</label>
													<div class="col-sm-8 d-flex align-items-center">
														<label class="radio-option mb-0"><input type="radio" name="rem2Email" value="Y" checked> Y</label>
														<label class="radio-option mb-0"><input type="radio" name="rem2Email" value="N"> N</label>
													</div>
												</div>
												<div class="form-group row align-items-center mb-0">
													<label class="col-sm-4 col-form-label font-weight-bold p-0 pl-2" style="font-size: 0.82rem;">SMS</label>
													<div class="col-sm-8 d-flex align-items-center">
														<label class="radio-option mb-0"><input type="radio" name="rem2SMS" value="Y" checked> Y</label>
														<label class="radio-option mb-0"><input type="radio" name="rem2SMS" value="N"> N</label>
													</div>
												</div>
											</div>
										</div>
									</fieldset>

									<!-- Fieldset 3: Reminder-3 -->
									<fieldset style="border: 1px solid #cbd5e1; padding: 12px 25px 12px 25px; border-radius: 4px; margin-bottom: 8px; max-width: 600px;">
										<legend style="width: auto; padding: 0 8px; font-size: 0.88rem; font-weight: bold; color: #2563eb; margin-bottom: 6px;">Reminder-3</legend>

										<div class="row">
											<!-- Left Column -->
											<div class="col-sm-6">
												<div class="form-group row align-items-center mb-2">
													<label class="col-sm-5 col-form-label font-weight-bold p-0 pl-2" style="font-size: 0.82rem;">Download</label>
													<div class="col-sm-7 d-flex align-items-center">
														<label class="radio-option mb-0"><input type="radio" name="rem3Download" value="Y" checked> Y</label>
														<label class="radio-option mb-0"><input type="radio" name="rem3Download" value="N"> N</label>
													</div>
												</div>
												<div class="form-group row align-items-center mb-0">
													<label class="col-sm-5 col-form-label font-weight-bold p-0 pl-2" style="font-size: 0.82rem;">Signature</label>
													<div class="col-sm-7 d-flex align-items-center">
														<label class="radio-option mb-0"><input type="radio" name="rem3Signature" value="Y" checked> Y</label>
														<label class="radio-option mb-0"><input type="radio" name="rem3Signature" value="N"> N</label>
													</div>
												</div>
											</div>

											<!-- Right Column -->
											<div class="col-sm-6">
												<div class="form-group row align-items-center mb-2">
													<label class="col-sm-4 col-form-label font-weight-bold p-0 pl-2" style="font-size: 0.82rem;">Email</label>
													<div class="col-sm-8 d-flex align-items-center">
														<label class="radio-option mb-0"><input type="radio" name="rem3Email" value="Y" checked> Y</label>
														<label class="radio-option mb-0"><input type="radio" name="rem3Email" value="N"> N</label>
													</div>
												</div>
												<div class="form-group row align-items-center mb-0">
													<label class="col-sm-4 col-form-label font-weight-bold p-0 pl-2" style="font-size: 0.82rem;">SMS</label>
													<div class="col-sm-8 d-flex align-items-center">
														<label class="radio-option mb-0"><input type="radio" name="rem3SMS" value="Y" checked> Y</label>
														<label class="radio-option mb-0"><input type="radio" name="rem3SMS" value="N"> N</label>
													</div>
												</div>
											</div>
										</div>
									</fieldset>

								</form>
							</div>

							<!-- Card Footer -->
							<div class="card-footer text-center border-top-0" style="background-color: #e9ecef;">
								<button type="button" class="btn-primary big-btn" id="btnHome" onclick="home();">Home</button>
								<button type="button" class="btn-primary big-btn" id="btnSubmit" onclick="submitForm();">Submit</button>
								<button type="button" class="btn-primary big-btn" id="btnBack" onclick="Back();">Back</button>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
