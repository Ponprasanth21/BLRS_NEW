<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">

<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="utf-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>BLRS - Change Password</title>


    <!-- Bootstrap -->

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/4.3.1/css/bootstrap.css}">


    <!-- jQuery -->

    <script th:src="@{/webjars/jquery/3.4.1/jquery.js}"></script>


    <!-- Bootstrap JS -->

    <script th:src="@{/webjars/bootstrap/4.3.1/js/bootstrap.js}"></script>


    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">


    <!-- Favicon -->

    <link rel="shortcut icon"
          th:href="@{/favicon.ico}"
          type="image/x-icon">

    <link rel="icon"
          th:href="@{/favicon.ico}"
          type="image/x-icon">


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }


        /* Background */

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background-image: url("images/BG_BLRS.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            z-index: -2;
        }


        /* Background overlay */

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.15);

            z-index: -1;
            pointer-events: none;
        }


        /* Main container */

        .login {
            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }


        /* Card */

        .card-container {
            max-width: 350px;
            width: 100%;
        }

        .card {
            background: rgba(255, 255, 255, 0.07);

            border: 1px solid rgba(0, 229, 255, 0.2);

            border-radius: 20px;

            padding: 25px;

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }


        /* Logo */

        .profile-logo {
            width: 96px;
            height: 96px;

            margin: 0 auto 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #ffffff;

            box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
        }

        .profile-logo img {
            width: 75px;
            height: 75px;

            border-radius: 50%;

            object-fit: contain;
        }


        /* Title */

        .profile-name-card {
            font-size: 16px;
            font-weight: bold;

            text-align: center;

            margin: 10px 0 20px;

            color: #ffffff;

            letter-spacing: 2px;
        }


        /* Labels */

        .form-signin label {
            display: block;

            color: rgba(255, 255, 255, 0.85);

            font-size: 13px;

            margin-bottom: 4px;
        }


        /* User ID */

        #userid {
            width: 100%;
            height: 44px;

            padding: 0 14px;

            background: #E8F0FE !important;

            border: 1px solid rgba(255, 255, 255, 0.15) !important;

            color: #000000 !important;

            border-radius: 8px;

            margin-bottom: 12px;
        }


        /* Password container */

        .password-container {
            position: relative;

            width: 100%;

            margin-bottom: 4px;
        }


        /* Password fields */

        .password-container input {
            width: 100%;
            height: 44px;

            padding: 0 42px 0 14px;

            background: #E8F0FE !important;

            border: 1px solid rgba(255, 255, 255, 0.15) !important;

            color: #000000 !important;

            border-radius: 8px;

            margin: 0;
        }


        /* Placeholder */

        #userid::placeholder,
        #new_password::placeholder,
        #old_password::placeholder {
            color: rgba(0, 0, 0, 0.4);
        }


        /* Input focus */

        .form-control:focus {
            border-color: rgb(104, 145, 162) !important;

            outline: 0;

            box-shadow:
                inset 0 1px 1px rgba(0, 0, 0, 0.075),
                0 0 8px rgb(104, 145, 162) !important;
        }


        /* Eye icon */

        .toggle-password {
            position: absolute;

            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            color: #000000;

            font-size: 15px;

            cursor: pointer;

            z-index: 10;
        }

        .toggle-password:hover {
            color: #0077b6;
        }


        /* Information messages */

        #newPasswordMessage,
        #oldPasswordMessage {
            width: 100%;

            min-height: 18px;

            font-size: 13px;

            font-weight: 500;

            text-align: left;

            padding-left: 2px;

            margin-top: 3px;
        }


        #newPasswordMessage {
            margin-bottom: 10px;
        }


        #oldPasswordMessage {
            margin-bottom: 10px;

            display: none;
        }


        /* Buttons */

        .btn-signin,
        .btn-back {
            width: 100%;

            height: 36px;

            border: none;

            border-radius: 3px;

            font-size: 14px;

            font-weight: 700;

            color: #ffffff;

            cursor: pointer;
        }


        /* Reset button */

        .btn-signin {
            background-color: #0077b6;

            margin-bottom: 10px;
        }

        .btn-signin:hover,
        .btn-signin:focus {
            background-color: #00b4d8;

            color: #ffffff;
        }


        /* Back button */

        .btn-back {
            background-color: #0077b6;
        }

        .btn-back:hover,
        .btn-back:focus {
            background-color: #00b4d8;

            color: #ffffff;
        }


        /* Hide browser password reveal */

        input::-ms-reveal,
        input::-ms-clear {
            display: none;
        }


        /* Mobile */

        @media (max-width: 480px) {

            .login {
                padding: 15px;
            }

            .card {
                padding: 20px;
            }

        }

    </style>
	<script>

	    /*
	     * Allow only uppercase letters, lowercase letters
	     * and numbers. Special characters are removed.
	     */
	    function letterAndNumbers(input) {
	        input.value = input.value.replace(/[^a-zA-Z0-9]/g, '');
	    }


	    /*
	     * Show / hide password.
	     */
	    function togglePassword(fieldId, icon) {

	        const field = document.getElementById(fieldId);

	        if (field.type === "password") {

	            field.type = "text";

	            icon.classList.remove("fa-eye");
	            icon.classList.add("fa-eye-slash");

	        } else {

	            field.type = "password";

	            icon.classList.remove("fa-eye-slash");
	            icon.classList.add("fa-eye");
	        }
	    }

	    function validateNewPassword() {

	        const password = $('#new_password').val();
	        const message = $('#newPasswordMessage');
	        message.text("").css("color", "");


	        /* Empty password */
	        if (password === "") {
	            return false;
	        }


	        /* Minimum 8 characters */
	        if (password.length < 8) {

	            message
	                .text("Password must contain at least 8 characters.")
	                .css("color", "#cd103c");

	            return false;
	        }


	        /* At least one number */
	        if (!/[0-9]/.test(password)) {

	            message
	                .text("Password must contain at least one number (0-9).")
	                .css("color", "#cd103c");

	            return false;
	        }


	        /* At least one uppercase letter */
	        if (!/[A-Z]/.test(password)) {

	            message
	                .text("Password must contain at least one uppercase letter (A-Z).")
	                .css("color", "#cd103c");

	            return false;
	        }


	        /* At least one special character */
	        if (!/[!@#$%^&*]/.test(password)) {

	            message
	                .text("Password must contain at least one special character.")
	                .css("color", "#cd103c");

	            return false;
	        }


	        /* Password is valid */
	        message
	            .text("Password format is valid.")
	            .css("color", "#34af32");

	        return true;
	    }


	    /*
	     * Reset / change password.
	     */
	    function openForm() {

	        const userId = $('#userid').val().trim();
	        const newPassword = $('#new_password').val();
	        const oldPassword = $('#old_password').val();

	        const oldPasswordMessage = $('#oldPasswordMessage');

	        oldPasswordMessage
	            .text("")
	            .hide();

	        if (!userId) {

	            oldPasswordMessage
	                .text("Please enter User Id.")
	                .css("color", "#cd103c")
	                .show();

	            $('#userid').focus();

	            return;
	        }


	        /*
	         * 2. Check New Password.
	         */
	        if (!newPassword) {

	            oldPasswordMessage
	                .text("Please enter New Password.")
	                .css("color", "#cd103c")
	                .show();

	            $('#new_password').focus();

	            return;
	        }


	        /*
	         * 3. Validate New Password format.
	         */
	        if (!validateNewPassword()) {

	            $('#new_password').focus();

	            return;
	        }


	        /*
	         * 4. Check Old Password.
	         */
	        if (!oldPassword) {

	            oldPasswordMessage
	                .text("Please enter Old Password.")
	                .css("color", "#cd103c")
	                .show();

	            $('#old_password').focus();

	            return;
	        }


	        /*
	         * 5. Old password and new password
	         *    must not be the same.
	         */
	        if (oldPassword === newPassword) {

	            oldPasswordMessage
	                .text("Old password and New password must not be the same.")
	                .css("color", "#cd103c")
	                .show();

	            $('#new_password').focus();

	            return;
	        }


	        /*
	         * 6. REST API URL.
	         */
	        const url =
	            './rest_password' +
	            '?user_id=' + encodeURIComponent(userId) +
	            '&new_password=' + encodeURIComponent(newPassword) +
	            '&old_password=' + encodeURIComponent(oldPassword);


	        /*
	         * 7. Call backend.
	         */
	        $.ajax({

	            type: "POST",

	            url: url,

	            cache: false,


	            /*
	             * Success response.
	             */
	            success: function(response) {

	                oldPasswordMessage
	                    .text(
	                        response ||
	                        "Password changed successfully."
	                    )
	                    .css("color", "#34af32")
	                    .show();


	                /* Clear password fields */
	                $('#old_password').val("");
	                $('#new_password').val("");


	                /* Clear password validation message */
	                $('#newPasswordMessage').text("");
	            },


	            /*
	             * Error response.
	             */
	            error: function(xhr) {

	                const errorMessage =
	                    xhr.responseText ||
	                    "Old password is incorrect.";


	                oldPasswordMessage
	                    .text(errorMessage)
	                    .css("color", "#cd103c")
	                    .show();


	                $('#old_password').focus();
	            }

	        });
	    }


	    /*
	     * Back to login page.
	     */
	    function back() {

	        window.location.href = './login';
	    }

	</script>
	
</head>


<body>


    <div class="container login">


        <div class="card-container">


            <div class="card">


                <!-- Logo -->

                <div class="profile-logo">

                    <img id="profile-img"
                         th:src="@{/images/Bornfire.png}"
                         alt="Bornfire">

                </div>


                <!-- Title -->

                <p id="profile-name"
                   class="profile-name-card">

                    BLRS Change Password

                </p>


                <form class="form-signin"
                      method="post"
                      name="Login_Form"
                      onsubmit="return false;">


                    <!-- User ID -->

                    <label for="userid">
                        User Id
                    </label>

                    <input type="text"
                           class="form-control"
                           name="userid"
                           id="userid"
                           placeholder="User Id"
                           required
                           autofocus
                           autocomplete="off"
                           oninput="letterAndNumbers(this);">


                    <!-- New Password -->

                    <label for="new_password">
                        New Password
                    </label>

                    <div class="password-container">

                        <input type="password"
                               class="form-control"
                               name="new_password"
                               id="new_password"
                               placeholder="New Password"
                               autocomplete="new-password"
                               required
                               oninput="validateNewPassword();">


                        <i class="fa-solid fa-eye toggle-password"
                           onclick="togglePassword('new_password', this)">
                        </i>

                    </div>


                    <!-- New Password information -->

                    <div id="newPasswordMessage"></div>


                    <!-- Old Password -->

                    <label for="old_password">
                        Old Password
                    </label>

                    <div class="password-container">

                        <input type="password"
                               class="form-control"
                               name="old_password"
                               id="old_password"
                               placeholder="Old Password"
                               autocomplete="current-password"
                               required>


                        <i class="fa-solid fa-eye toggle-password"
                           onclick="togglePassword('old_password', this)">
                        </i>

                    </div>


                    <!-- Reset response -->

                    <div id="oldPasswordMessage"></div>


                    <!-- Reset Password -->

                    <button type="button"
                            class="btn btn-signin"
                            onclick="openForm();">

                        Reset Password

                    </button>


                    <!-- Back -->

                    <button type="button"
                            class="btn btn-back"
                            onclick="back();">

                        Back

                    </button>


                </form>

            </div>

        </div>

    </div>


</body>

</html>
