<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
	<!-- BAJ VERSION 1.0.1 -->
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>BLRS</title>

	<link rel="stylesheet" type="text/css" href="/webjars/bootstrap/4.3.1/css/bootstrap.min.css" th:href="@{/webjars/bootstrap/4.3.1/css/bootstrap.min.css}">
	<link rel="stylesheet" type="text/css" href="/webjars/font-awesome/5.9.0/css/all.min.css" th:href="@{/webjars/font-awesome/5.9.0/css/all.min.css}">
	<link rel="stylesheet" type="text/css" href="/webjars/jquery-ui/1.12.1/jquery-ui.min.css" th:href="@{/webjars/jquery-ui/1.12.1/jquery-ui.min.css}">
	<link rel="stylesheet" type="text/css" href="/webjars/datatables/1.10.19/css/jquery.dataTables.min.css" th:href="@{/webjars/datatables/1.10.19/css/jquery.dataTables.min.css}">

	<script src="/webjars/jquery/3.4.1/jquery.min.js" th:src="@{/webjars/jquery/3.4.1/jquery.min.js}"></script>
	<script src="/webjars/jquery-ui/1.12.1/jquery-ui.min.js" th:src="@{/webjars/jquery-ui/1.12.1/jquery-ui.min.js}"></script>
	<script src="/webjars/popper.js/1.14.7/umd/popper.min.js" th:src="@{/webjars/popper.js/1.14.7/umd/popper.min.js}"></script>
	<script src="/webjars/bootstrap/4.3.1/js/bootstrap.min.js" th:src="@{/webjars/bootstrap/4.3.1/js/bootstrap.min.js}"></script>
	<script src="/webjars/datatables/1.10.19/js/jquery.dataTables.min.js" th:src="@{/webjars/datatables/1.10.19/js/jquery.dataTables.min.js}"></script>
	<script src="/webjars/datatables/1.10.19/js/dataTables.bootstrap4.min.js" th:src="@{/webjars/datatables/1.10.19/js/dataTables.bootstrap4.min.js}"></script>

	<link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">
	<link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">

	<style>
		@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
		body { background-color: #f8fafc !important; font-family: 'Outfit', sans-serif !important; color: #1e293b;
			overscroll-behavior: none !important; margin: 0; padding-top: 70px; overflow-x: hidden; }
		.container-manager { width: 100%; max-width: 100%; padding: 0 0.8%; margin: 10px auto 40px;
			box-sizing: border-box; }
		.btn-primary { background-color: #007bff !important; border-color: #007bff !important; color: #fff !important; }
		.btn-primary:hover { background-color: #0069d9 !important; border-color: #0062cc !important; }
		.big-btn { padding: 4px 14px; font-size: 0.85rem; border-radius: 4px; border: 1px solid #007bff; cursor: pointer; }
		.card { box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border-radius: 6px; border: 1px solid #cbd5e1; }
		.card-header, .card-footer { background-color: #e9ecef; }
		.data-table th { font-weight: bold; border-bottom: 2px solid #cbd5e1 !important; background-color: #f1f5f9; color: #334155; }
		.data-table { width: 100%; font-size: 0.83rem; }
		@media (max-width: 767.98px) { .container-manager { padding: 0 10px; } }
	</style>
	<script>
		function editRow(link) {
			var tr = $(link).closest('tr');
			tr.find('.pref, .pack').each(function () {
				var td = $(this);
				td.empty().append($('<input type="text" class="form-control form-control-sm" maxlength="50">').val(td.data('val') || ''));
			});
			tr.find('.edit-link').addClass('d-none');
			tr.find('.save-link').removeClass('d-none');
		}

		function saveRow(link) {
			var tr = $(link).closest('tr');
			var tbl = $('#dispatchTable');
			var ref = tr.find('.pref input').val();
			var ack = tr.find('.pack input').val();

			$.post('saveDispatchDetails', {
				reminder_type: tbl.data('type'),
				rem_date: tbl.data('date'),
				acc_num: tr.data('acc'),
				postal_ref: ref,
				postal_ack: ack
			}).done(function (msg) {
				alert(msg);
				if (msg.indexOf('Data Saved') === 0) {
					tr.find('.pref').data('val', ref).text(ref);
					tr.find('.pack').data('val', ack).text(ack);
					tr.find('.save-link').addClass('d-none');
					tr.find('.edit-link').removeClass('d-none');
				}
			}).fail(function () {
				alert('Unable to save. Please try again.');
			});
		}

		function validateSearch() {
			if (!$('#reminderType').val() || !$('#reminderDate').val()) {
				alert('Select both Reminder Type and Reminder Date.');
				return false;
			}
			return true;
		}
	</script>
</head>
<script>
$(document).ready(function () {
    if ($('#dispatchTable').length &&
        !$.fn.DataTable.isDataTable('#dispatchTable')) {

        $('#dispatchTable').DataTable({
            pageLength: 5,
            lengthChange: true,
            searching: false,
            ordering: true,
            paging: true,
            info: true
        });
    }
});
</script>
<body>
	<div th:insert="BLRS_HeaderMenu :: header"></div>

	<div class="container-manager">
		<div class="row d-flex justify-content-center">
			<div class="col-sm-12 mt-2">
				<div th:if="${formmode}=='list'">
					<div class="card">

						<div class="card-header">
							<h6 class="m-0">Dispatch Details</h6>
						</div>

						<div class="card-body" style="border-top: 1px solid #cbd5e1; border-bottom: 1px solid #cbd5e1;">
							<form id="dispatchForm"
							      th:action="@{/Dispatchdetails}"
							      method="get"
							      onsubmit="return validateSearch();">
								<div class="form-group row justify-content-center align-items-center mb-2">
									<label class="col-auto col-form-label font-weight-bold mr-2" for="reminderType" style="font-size: 0.88rem;">Reminder Type</label>
									<div class="col-auto mr-4" style="min-width: 180px;">
										<select class="form-control form-control-sm"
										        name="reminderType"
										        id="reminderType">

										    <option value="">Select</option>

										    <option th:each="p : ${ReminderParams}"
										            th:value="${p['name']}"
										            th:text="${p['name']}"
										            th:selected="${p['name'] == reminderType}">
										    </option>

										</select>
									</div>
									<label class="col-auto col-form-label font-weight-bold mr-2" for="reminderDate" style="font-size: 0.88rem;">Reminder Date</label>
									<div class="col-auto mr-4" style="min-width: 180px;">
										<input type="date" class="form-control form-control-sm" name="reminderDate" id="reminderDate" th:value="${reminderDate}">
									</div>
									<div class="col-auto">
										<button type="submit" class="btn btn-primary btn-sm px-3" id="btnSearch">Search</button>
									</div>
								</div>
							</form>

							<div class="alert alert-warning py-1 text-center" th:if="${errorMsg != null}" th:text="${errorMsg}"></div>

							<div th:if="${searched != null}" style="overflow-x: auto;">
								<table class="table table-bordered table-striped table-hover mb-0 data-table" id="dispatchTable"
									th:attr="data-type=${reminderType},data-date=${reminderDate}"
									th:if="${dispatchList != null and !#lists.isEmpty(dispatchList)}">
									<thead>
										<tr>
											<th>Scheme Code</th>
											<th>Customer ID</th>
											<th>Loan Number</th>
											<th>Borrower Name</th>
											<th class="text-right">Overdue</th>
											<th>Postal Reference</th>
											<th>Postal Acknowledgement</th>
											<th class="text-center">Modify</th>
										</tr>
									</thead>
									<tbody>
										<tr th:each="d : ${dispatchList}" th:attr="data-acc=${d.acc_num}">
											<td th:text="${d.sch_code}"></td>
											<td th:text="${d.cust_id}"></td>
											<td th:text="${d.acc_num}"></td>
											<td th:text="${d.acc_name}"></td>
											<td class="text-right"
												th:text="${d.overdue != null} ? ${#numbers.formatDecimal(d.overdue, 1, 'COMMA', 2, 'POINT')} : '0.00'"></td>
											<td class="pref" th:attr="data-val=${d.postal_ref}" th:text="${d.postal_ref}"></td>
											<td class="pack" th:attr="data-val=${d.postal_ack}" th:text="${d.postal_ack}"></td>
											<td class="text-center">
												<a href="#" class="edit-link" onclick="editRow(this); return false;">Edit</a>
												<a href="#" class="save-link d-none font-weight-bold" onclick="saveRow(this); return false;">Save</a>
											</td>
										</tr>
									</tbody>
								</table>
								<div class="text-center text-muted py-3" th:if="${dispatchList == null or #lists.isEmpty(dispatchList)}">
									No records found for the selected reminder type and date.
								</div>
							</div>
						</div>
				<div class="card-footer text-center border-top-0">
					<button type="button" class="btn-primary big-btn" id="btnHome" onclick="location.href='./Dashboard';">Home</button>
					<button type="button" class="btn-primary big-btn" id="btnBack" onclick="window.history.back();">Back</button>
				</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
