	<style>
		@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

		body {
			background-color: #f8fafc !important;

		/* .container-manager {
			width: 83.5%;
			padding-right: 15px;
			padding-left: 15px;
			margin-right: auto;

		.container-manager {
			width: 83.5%;

			padding-left: 15px;
			margin-right: auto;
			margin-left: 16% !important;

		/* KPI Card Styles */
		.kpi-card {
			background: #ffffff;
			border: 1px solid rgba(226, 232, 240, 0.8);
			border-radius: 12px;
			padding: 20px;
			position: relative;
			overflow: hidden;
			box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
			transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
			display: flex;
			flex-direction: column;
			height: 100%;
		}

		.kpi-card:hover {
			transform: translateY(-4px);
			box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
		}

		.kpi-icon-container {
			width: 42px;
			height: 42px;
			border-radius: 8px;
			display: flex;
			align-items: center;
			justify-content: center;
			margin-bottom: 12px;
		}

		.kpi-title {
			font-size: 0.78rem;
			font-weight: 600;
			color: #64748b;
			text-transform: uppercase;
			letter-spacing: 0.05em;
		}

		.kpi-value {
			font-size: 1.3rem;
			font-weight: 700;
			color: #0f172a;
			margin-top: 4px;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;

		/* Specific Borders for KPI Cards */

		}

		.border-left-rose {

		}

		.border-left-indigo {

		}

		.border-left-emerald {
			border-left: 4px solid #10b981;
		}

		.border-left-orange {

		.border-left-violet {

		}

		/* Icon Container Color Combinations */

			background-color: #f0fdfa;
		}

		}

		.bg-rose-light {

		.text-rose {

		}

		.bg-indigo-light {
			background-color: #e0e7ff;
		}

		.text-indigo {

		.bg-emerald-light {
			background-color: #ecfdf5;

			color: #10b981;
		}

		.bg-orange-light {

		.bg-violet-light {

		/* Chart Card Styles */
		.chart-card {
			background: #ffffff;
			border: 1px solid rgba(226, 232, 240, 0.8);
			border-radius: 12px;
			padding: 20px;
			box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03), 0 2px 4px -1px rgba(0, 0, 0, 0.02);

		.chart-title {
			font-size: 0.95rem;

			color: #334155;

		/* Table Card Styles */
		.table-card {
			background: #ffffff;
			border: 1px solid rgba(226, 232, 240, 0.8);
			border-radius: 12px;
			padding: 20px;
			box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03), 0 2px 4px -1px rgba(0, 0, 0, 0.02);

		}

		.custom-table {
			width: 100%;
			border-collapse: separate;
			border-spacing: 0;

		}

		.custom-table th {
			background: #f8fafc;

			font-size: 0.72rem;

			text-transform: uppercase;
			letter-spacing: 0.05em;

		.custom-table td {
			padding: 10px 14px;

		.custom-table tr:hover td {

		.custom-table tr:last-child td {

		/* Status Badges */
		.status-badge {
			display: inline-flex;
			align-items: center;

		.status-success {
			background-color: #d1fae5;
			color: #065f46;
		}

		.status-warning {
			background-color: #fef3c7;
			color: #92400e;
		}

		.status-danger {
			background-color: #fee2e2;

		}

		.status-info {
			background-color: #e0f2fe;
			color: #075985;
		}

		/* Scrollbar Styling */
		.table-responsive::-webkit-scrollbar {

			height: 6px;

		.table-responsive::-webkit-scrollbar-track {

		}

		.table-responsive::-webkit-scrollbar-thumb {
			background: #cbd5e1;
			border-radius: 4px;
		}

		.table-responsive::-webkit-scrollbar-thumb:hover {
			background: #94a3b8;
		}
	</style>

	<script th:inline="javascript">
		/*<![CDATA[*/
		function Yes() {
			location.href = "./changePassword";
		}

		$(document).ready(function () {
			// Password expiration warning
			var pdateEl = document.getElementById("pdate");
			if (pdateEl && pdateEl.value) {
				var userdate = pdateEl.value;
				var userdate1 = userdate.split('-');
				var date1 = userdate1[0];
				var month1 = userdate1[1];
				var year = userdate1[2];
				let todays = new Date().toISOString().slice(0, 10);
				const startDate = todays;
				const endDate = userdate;

				const diffInMs = new Date(endDate) - new Date(startDate)
				const diffInDays = diffInMs / (1000 * 60 * 60 * 24);

				if (diffInDays <= 3 && diffInDays > 0) {
					$("#alert1").modal("toggle");
				} else if (diffInDays == 0) {
					$('#alert2').modal({backdrop: 'static', keyboard: false}, 'show');
					$("#alert2").modal("toggle");
				}
			}

			// Format current date display
			var options = {weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'};
			var today = new Date();
			$('#current-date-span').text(today.toLocaleDateString('en-US', options));

			// Fetch dynamic stats for Dashboard
			loadDashboardData();
		});

		function formatCurrency(val) {
			if (val === undefined || val === null) return '0.00';
			var num = parseFloat(val);
			if (isNaN(num)) return '0.00';
			return num.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
		}

		function formatCurrencyShort(val) {
			if (val === undefined || val === null) return '0';
			var num = parseFloat(val);
			if (isNaN(num)) return '0';
			var absNum = Math.abs(num);
			if (absNum >= 10000000) { // 1 Crore
				return (num / 10000000).toFixed(1) + ' Cr';
			}
			if (absNum >= 100000) { // 1 Lakh
				return (num / 100000).toFixed(1) + ' L';
			}
			if (absNum >= 1000) {
				return (num / 1000).toFixed(1) + ' K';
			}
			return num.toFixed(0);
		}

		function loadDashboardData() {
			$.getJSON('./api/dashboard/stats', function (data) {
				if (!data) return;

				// 1. Populating KPI Values
				$('#val-assets').text(formatCurrency(data.totalAssets));
				$('#val-liabilities').text(formatCurrency(data.totalLiabilities));
				$('#val-equity').text(formatCurrency(data.totalEquity));
				$('#val-income').text(formatCurrency(data.totalIncome));
				$('#val-expenses').text(formatCurrency(data.totalExpenses));
				$('#val-netprofit').text(formatCurrency(data.netProfit));

				// Style net profit dynamically
				var netProfit = parseFloat(data.netProfit || 0);
				if (netProfit < 0) {
					$('#val-netprofit').css('color', '#dc2626');
				} else {
					$('#val-netprofit').css('color', '#059669');
				}

				// 2. Revenue vs Expenses Chart (Bar)
				var ctxRevExp = document.getElementById('chart-rev-exp').getContext('2d');
				new Chart(ctxRevExp, {
					type: 'bar',
					data: {
						labels: data.monthlyLabels,
						datasets: [
							{
								label: 'Revenue',
								data: data.monthlyIncome,
								backgroundColor: 'rgba(56, 189, 248, 0.85)',
								borderColor: 'rgb(14, 165, 233)',
								borderWidth: 1
							},
							{
								label: 'Expenses',
								data: data.monthlyExpenses,
								backgroundColor: 'rgba(251, 113, 133, 0.85)',
								borderColor: 'rgb(244, 63, 94)',
								borderWidth: 1
							}
						]
					},
					options: {
						responsive: true,
						maintainAspectRatio: false,
						legend: {
							position: 'top',
							labels: {
								fontFamily: "'Outfit', sans-serif",
								usePointStyle: true
							}
						},
						scales: {
							yAxes: [{
								ticks: {
									beginAtZero: true,
									fontFamily: "'Outfit', sans-serif",
									callback: function (value) {return formatCurrencyShort(value);}
								},
								gridLines: {
									color: '#f1f5f9'
								}
							}],
							xAxes: [{
								ticks: {
									fontFamily: "'Outfit', sans-serif"
								},
								gridLines: {
									display: false
								}
							}]
						},
						tooltips: {
							titleFontFamily: "'Outfit', sans-serif",
							bodyFontFamily: "'Outfit', sans-serif",
							callbacks: {
								label: function (tooltipItem, dataObj) {
									return dataObj.datasets[tooltipItem.datasetIndex].label + ': ' + formatCurrency(tooltipItem.yLabel);
								}
							}
						}
					}
				});

				// 3. Financial Mix (Doughnut)
				var ctxMix = document.getElementById('chart-fin-mix').getContext('2d');
				new Chart(ctxMix, {
					type: 'doughnut',
					data: {
						labels: ['Assets', 'Liabilities', 'Equity'],
						datasets: [{
							data: [Math.abs(data.totalAssets || 0), Math.abs(data.totalLiabilities || 0), Math.abs(data.totalEquity || 0)],
							backgroundColor: [
								'rgba(13, 148, 136, 0.85)', // Teal
								'rgba(225, 29, 72, 0.85)',  // Red
								'rgba(79, 70, 229, 0.85)'   // Blue/Indigo
							],
							borderWidth: 1
						}]
					},
					options: {
						responsive: true,
						maintainAspectRatio: false,
						legend: {
							position: 'bottom',
							labels: {
								fontFamily: "'Outfit', sans-serif",
								usePointStyle: true
							}
						},
						tooltips: {
							titleFontFamily: "'Outfit', sans-serif",
							bodyFontFamily: "'Outfit', sans-serif",
							callbacks: {
								label: function (tooltipItem, dataObj) {
									var label = dataObj.labels[tooltipItem.index];
									var val = dataObj.datasets[0].data[tooltipItem.index];
									return label + ': ' + formatCurrency(val);
								}
							}
						}
					}
				});

				// 4. Top Accounts (Horizontal Bar)
				var topAccNames = (data.topAccounts || []).map(function (a) {return a.name;});
				var topAccBals = (data.topAccounts || []).map(function (a) {return Math.abs(a.balance || 0);});
				var topAccColors = (data.topAccounts || []).map(function (a) {
					var cls = (a.classification || '').toLowerCase();
					if (cls === 'asset') return 'rgba(13, 148, 136, 0.85)';
					if (cls === 'liability') return 'rgba(225, 29, 72, 0.85)';
					if (cls === 'income') return 'rgba(16, 185, 129, 0.85)';
					if (cls === 'expense') return 'rgba(249, 115, 22, 0.85)';
					return 'rgba(99, 102, 241, 0.85)';
				});

				var ctxTop = document.getElementById('chart-top-accounts').getContext('2d');
				new Chart(ctxTop, {
					type: 'horizontalBar',
					data: {
						labels: topAccNames,
						datasets: [{
							data: topAccBals,
							backgroundColor: topAccColors,
							borderWidth: 1
						}]
					},
					options: {
						responsive: true,
						maintainAspectRatio: false,
						legend: {
							display: false
						},
						scales: {
							xAxes: [{
								ticks: {
									beginAtZero: true,
									fontFamily: "'Outfit', sans-serif",
									callback: function (value) {return formatCurrencyShort(value);}
								},
								gridLines: {
									color: '#f1f5f9'
								}
							}],
							yAxes: [{
								ticks: {
									fontFamily: "'Outfit', sans-serif"
								},
								gridLines: {
									display: false
								}
							}]
						},
						tooltips: {
							titleFontFamily: "'Outfit', sans-serif",
							bodyFontFamily: "'Outfit', sans-serif",
							callbacks: {
								label: function (tooltipItem, dataObj) {
									return dataObj.labels[tooltipItem.index] + ': ' + formatCurrency(tooltipItem.xLabel);
								}
							}
						}
					}
				});

				// 5. Net Profit Trend (Line)
				var netProfitTrend = [];
				var monthlyIncomeList = data.monthlyIncome || [];
				var monthlyExpensesList = data.monthlyExpenses || [];
				for (var i = 0; i < monthlyIncomeList.length; i++) {
					var inc = parseFloat(monthlyIncomeList[i] || 0);
					var exp = parseFloat(monthlyExpensesList[i] || 0);
					netProfitTrend.push(inc - exp);
				}

				var ctxProfit = document.getElementById('chart-net-profit').getContext('2d');
				new Chart(ctxProfit, {
					type: 'line',
					data: {
						labels: data.monthlyLabels,
						datasets: [{
							label: 'Net Profit',
							data: netProfitTrend,
							backgroundColor: 'rgba(99, 102, 241, 0.08)',
							borderColor: 'rgb(79, 70, 229)',
							borderWidth: 2,
							pointBackgroundColor: 'rgb(79, 70, 229)',
							pointRadius: 4,
							fill: true
						}]
					},
					options: {
						responsive: true,
						maintainAspectRatio: false,
						legend: {
							display: false
						},
						scales: {
							yAxes: [{
								ticks: {
									fontFamily: "'Outfit', sans-serif",
									callback: function (value) {return formatCurrencyShort(value);}
								},
								gridLines: {
									color: '#f1f5f9'
								}
							}],
							xAxes: [{
								ticks: {
									fontFamily: "'Outfit', sans-serif"
								},
								gridLines: {
									display: false
								}
							}]
						},
						tooltips: {
							titleFontFamily: "'Outfit', sans-serif",
							bodyFontFamily: "'Outfit', sans-serif",
							callbacks: {
								label: function (tooltipItem, dataObj) {
									return 'Net Profit: ' + formatCurrency(tooltipItem.yLabel);
								}
							}
						}
					}
				});

				// 6. Recent Transactions Table
				var txBody = $('#recent-transactions-body');
				txBody.empty();
				if (data.recentTransactions && data.recentTransactions.length > 0) {
					data.recentTransactions.forEach(function (tx) {
						var typeBadgeClass = (tx.type || '').toLowerCase() === 'cr' ? 'status-success' : 'status-info';
						var amtFormatted = formatCurrency(tx.amount);
						var row = '<tr>' +
							'<td>' + (tx.date || '') + '</td>' +
							'<td>' + (tx.tranId || '') + '</td>' +
							'<td>' + (tx.acctName || '') + '</td>' +
							'<td>' + (tx.particular || '') + '</td>' +
							'<td><span class="status-badge ' + typeBadgeClass + '">' + (tx.type || '') + '</span></td>' +
							'<td class="text-right font-weight-bold">' + amtFormatted + '</td>' +
							'</tr>';
						txBody.append(row);
					});
				} else {
					txBody.append('<tr><td colspan="6" class="text-center text-muted">No recent postings found</td></tr>');
				}

				// 7. Recent Invoices Table
				var invBody = $('#recent-invoices-body');
				invBody.empty();
				if (data.recentInvoices && data.recentInvoices.length > 0) {
					data.recentInvoices.forEach(function (inv) {
						var statusClass = 'status-warning';
						var statusLower = (inv.status || '').toLowerCase();
						if (statusLower === 'paid' || statusLower === 'y') {
							statusClass = 'status-success';
						} else if (statusLower === 'cancelled') {
							statusClass = 'status-danger';
						}
						var amtFormatted = formatCurrency(inv.amount);
						var statusLabel = inv.status || 'Pending';
						if (statusLabel === 'Y') statusLabel = 'Paid';
						if (statusLabel === 'N') statusLabel = 'Unpaid';
						var row = '<tr>' +
							'<td>' + (inv.invNo || '') + '</td>' +
							'<td>' + (inv.clientName || '') + '</td>' +
							'<td>' + (inv.date || '') + '</td>' +
							'<td><span class="status-badge ' + statusClass + '">' + statusLabel + '</span></td>' +
							'<td class="text-right font-weight-bold">' + amtFormatted + '</td>' +
							'</tr>';
						invBody.append(row);
					});
				} else {
					invBody.append('<tr><td colspan="5" class="text-center text-muted">No recent invoices found</td></tr>');
				}
			}).fail(function () {
				console.error("Failed to fetch dashboard stats.");
				$('#recent-transactions-body').html('<tr><td colspan="6" class="text-center text-danger">Error loading data.</td></tr>');
				$('#recent-invoices-body').html('<tr><td colspan="5" class="text-center text-danger">Error loading data.</td></tr>');
			});
		}
		/*]]>*/
	</script>
</head>

<body>
	<div th:insert="BLRS_HeaderMenu :: header"></div>

	<div class="container-manager">
		<div class="row d-flex justify-content-center">
			<div class="col-sm-11 mt-2">

				<div th:if="${formmode}=='list'">
					<div class="panel panel-primary filterable">
						<div class="card">
							<div class="card-header" style="background-color: #e9ecef">
								<div class="float-left">
									<h6>User Operation - List</h6>
								</div>
