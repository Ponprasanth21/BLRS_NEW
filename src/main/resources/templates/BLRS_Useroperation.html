<script>
	$(function () {

	    $("#Fromdate").datepicker({
	        changeMonth: true,
	        changeYear: true,
	        dateFormat: "dd/mm/yy",
	        maxDate: 0,

	        onSelect: function (selected) {

	            var dt = $(this).datepicker('getDate');

	            $("#Todate").datepicker("option", "minDate", dt);
	        }
	    });


	    $("#Todate").datepicker({
	        changeMonth: true,
	        changeYear: true,
	        maxDate: 0,
	        dateFormat: "dd/mm/yy",

	        onSelect: function (selected) {

	            var Fromdate = document.getElementById("Fromdate").value;
	            var Todate = document.getElementById("Todate").value;

	            if (Fromdate == "") {

	                alert("Enter From date");

	            } else {

	                location.href =
	                    'Useroperation?Fromdate='
	                    + Fromdate
	                    + '&Todate='
	                    + Todate;
	            }
	        }
	    });

	});

	function home() {
		location.href = '/BSWIFT/BSWIFTDashboard'
	}

	function back() {
		window.history.back();
	}
	/* 	function running(){
	 var Fromdate = document.getElementById("Fromdate").value;
	 var Todate = document.getElementById("Todate").value;
	 if (Fromdate == "") {
	 alert("Enter From date");
	 }else if (Todate == "") {
	 alert("Enter To date");
	 }else {
	 location.href = 'BAMLAuditInquiry?Fromdate='
	 + Fromdate + '&Todate=' + Todate;
	 }
	 } */

	$(document).ready(function () {

		var table;
		var filterActive = false;

		var normalHeaderHtml =
			'<tr id="normalHeaderRow" style="height: auto;">' +
			'<th>Audit Date</th>' +
			'<th>Table Name</th>' +
			'<th>Function</th>' +
			'<th>Entry User</th>' +
			'<th>Entry Time</th>' +
			'<th>Authorizer</th>' +
			'<th>Field Name</th>' +
			'<th>Old Value</th>' +
			'<th>New Value</th>' +
			'<th>Remarks</th>' +
			'</tr>';

		var columnTitles = ["Audit Date", "Table Name", "Function", "Entry User", "Entry Time", "Authorizer", "Field Name", "Old Value", "New Value", "Remarks"];

		function buildFilterHeaderHtml() {
			var html = '<tr id="filterHeaderRow">';
			columnTitles.forEach(function (title, idx) {
				html += '<th style="padding:3px !important;background-color:#414D59;color:black" class="inputcolors">' +
					'<input type="text" style="border:2px solid black;background-color:white;color:black" class="form-control form-control-sm col-search" ' +
					'data-col="' + idx + '" placeholder="' + title + '">' +
					'</th>';
			});
			html += '</tr>';
			return html;
		}

		function initTable() {

			table = $('#usertable').DataTable({
				"destroy": true,
				"paging": true,
				"autoWidth": false,
				"ordering": false,
				"searching": true,
				"pageLength": 100,
				"lengthChange": false,
				"dom": 'r<"table-scroll-container"t>ip',   // wraps only table in scroll container; keeps pagination/info fixed below it
				"columnDefs": [
					{width: "8%", targets: 0},
					{width: "10%", targets: 1},
					{width: "10%", targets: 2},
					{width: "10%", targets: 3},
					{width: "12%", targets: 4},
					{width: "10%", targets: 5},
					{width: "10%", targets: 6},
					{width: "10%", targets: 7},
					{width: "10%", targets: 8},
					{width: "10%", targets: 9}
				],
				"initComplete": function () {
					this.api().columns.adjust();
				},
				"drawCallback": function () {
					this.api().columns.adjust();
				}
			});

			// Re-adjust columns on window resize/zoom to fix misalignment
			$(window).off('resize.adjust').on('resize.adjust', function () {
				if (table) {
					table.columns.adjust();
				}
			});
		}

		initTable();

		$('#btnToggleFilter').on('click', function () {

			var savedSearches = {};
			if (filterActive) {
				$('#usertable_wrapper .col-search').each(function () {
					savedSearches[$(this).data('col')] = $(this).val();
				});
			}

			table.destroy();

			if (!filterActive) {
				$('#usertable thead').html(buildFilterHeaderHtml());
				filterActive = true;
			} else {
				$('#usertable thead').html(normalHeaderHtml);
				filterActive = false;
			}

			initTable();

			if (filterActive) {
				Object.keys(savedSearches).forEach(function (colIdx) {
					if (savedSearches[colIdx]) {
						table.column(colIdx).search(savedSearches[colIdx]);
						$('#usertable_wrapper .col-search[data-col="' + colIdx + '"]').val(savedSearches[colIdx]);
					}
				});
				table.draw();
			}
		});

		var searchTimeout;
		$(document).on('keyup change', '#usertable_wrapper .col-search', function () {
			var colIdx = $(this).data('col');
			var val = this.value;

			clearTimeout(searchTimeout);
			searchTimeout = setTimeout(function () {
				table.column(colIdx).search(val).draw();
			}, 300);
		});

		$(document).on('click', '#usertable_wrapper .col-search', function (e) {
			e.stopPropagation();
		});

	});
</script>
<title>BSWIFT</title>

<body>
	<!-- <div th:replace="MMenupage :: header"></div> -->

	<div th:insert="BLRS_HeaderMenu :: header"></div>

	<div class="container-manager">

		<div class="card">


			<div class="card-header" id="modheadtitle"
				style="height: 47px; display:flex; justify-content: space-between; padding:0px 10px;align-items: center; position: relative; top: -2px;">
				<b style="font-size: 1.2rem">User Activity Audits</b>
				<button type="button" class="btn btn-sm btn-primary" id="btnToggleFilter">
					<i class="fas fa-filter"></i> Filter
				</button>
			</div>
			<label></label>
			<div class="row formline">
				<div class="col-sm-1"></div>
				<div class="col-sm-1"></div>

				<div class="col-sm-1">
					<label for="CUSTID">From Date</label>
				</div>

				<div class="col-sm-2">
					<input type="text" id="Fromdate" th:value="${Fromdate}" class="form-control form-control-sm"
						name="cust_id" autocomplete="off" />
				</div>
				<div class="col-sm-1"></div>

				<div class="col-sm-1">
					<label for="custName">To Date</label>
				</div>

				<div class="col-sm-2">
					<input type="text" id="Todate" name="cust_name" onblur="running()" th:value="${Todate}"
						class="form-control form-control-sm" autocomplete="false" required />
				</div>




			</div>

			<label></label>

			<!-- <div class="card-body"> -->
			<table class="table table-striped table-bordered table-hover" id="usertable">
				<thead class="thead-light">

					<tr>


						<th>Audit Date</th>
						<th>Table Name</th>
						<th>Function</th>
						<th>Entry User</th>
						<th>Entry Time</th>
						<th>Authorizer</th>
						<th>Field Name</th>
						<th>Old Value</th>
						<th>New Value</th>
						<th>Remarks</th>


					</tr>
				</thead>
				<tbody>

					<tr th:each="auditdata : ${AuditList}" class="userlist">

						<td th:text="${#dates.format(auditdata?.audit_date, 'dd/MM/yyyy')}"></td>

						<td th:text="${auditdata?.audit_table}"></td>

						<td th:text="${auditdata?.func_code}"></td>

						<td th:text="${auditdata?.entry_user}"></td>

						<td th:text="${#dates.format(auditdata?.entry_time, 'dd-MM-yyyy HH:mm a')}"></td>

						<td>
							<span th:if="${auditdata?.auth_user != null and auditdata?.auth_user != ''}"
								th:text="${auditdata?.auth_user}">
							</span>

							<span th:if="${auditdata?.auth_user == null or auditdata?.auth_user == ''}"
								style="color:red">
							</span>
						</td>

						<!-- Modification Details -->
						<td th:text="${auditdata?.modi_details}"></td>

						<!-- Old Value -->
						<td></td>

						<!-- New Value -->
						<td></td>

						<td th:text="${auditdata?.remarks}"></td>

					</tr>

				</tbody>
			</table>
			<div class="text-center" style="background-color: #386276; padding: 5px; width: 100%;">

				<div class="btn-group nav-buttons " style="align: center;">
					<button type="button" class="btn btn-xs btn-primary" id="btnHome" onclick="home();"
						style="margin-right: 10px;">Home</button>
					<button type="button" class="btn btn-xs btn-primary" id="btnBack" onclick="back();">Back</button>
				</div>
			</div>

		</div>

	</div>



</body>
