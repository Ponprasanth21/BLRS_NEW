<script>

	$(function () {

		$("#Fromdate").datepicker({

			changeMonth: true,

			changeYear: true,

			dateFormat: "dd/mm/yy",

			maxDate: 0,

			onSelect: function (selected) {

				var dt = $(this).datepicker('getDate');

				dt.setDate(dt.getDate());

				$("#Todate").datepicker("option", "minDate", dt);

			}

		});

		$("#Todate")

			.datepicker(

				{

					changeMonth: true,

					changeYear: true,

					maxDate: 0,

					dateFormat: "dd/mm/yy",

					onSelect: function (selected) {

						var dt = new Date(selected);

						dt.setDate(dt.getDate() - 1);

						var Fromdate = document

							.getElementById("Fromdate").value;

						var Todate = document.getElementById("Todate").value;

						if (Fromdate == "") {

							alert("Enter From date");

						} else {

							location.href = 'Businessoperation?Fromdate='

								+ Fromdate + '&Todate=' + Todate;

						}

						//$("#period_start_date").datepicker("option", "maxDate", dt);

					}

				});

	});

	function getUserlist(mode, num, maxpage) {

		var n = parseInt(num);

		var max = parseInt(maxpage);

		var Fromdate = document.getElementById("Fromdate").value;

		var Todate = document.getElementById("Todate").value;

		var Callurl = 'Businessoperation?Fromdate=' + Fromdate + '&Todate='

			+ Todate;

		switch (mode) {

			case "nextpage":

				n = n + 1;

				if (n > max) {

					break;

				}

				Callurl = Callurl + "&page=" + n;

				break;

			case "prevpage":

				n = n - 1;

				if (n < 0) {

					break;

				}

				Callurl = Callurl + "&page=" + n;

				break;

			case "givenpage":

				n = parseInt($("#pageno").val()) - 1;

				if (n > max || n < 0) {

					break;

				}

				Callurl = Callurl + "&page=" + n;

		}

		location.href = Callurl;

	}

	function home() {

		location.href = '/BLRS/Dashboard'

	}


	function back() {

		window.history.back();

	}

	$(document).ready(function () {

		var table; // holds current DataTable instance

		var filterActive = false;

		var normalHeaderHtml =

			'<tr id="normalHeaderRow" style="height: auto;">' +

			'<th>Audit Date</th>' +

			'<th>Table Name</th>' +

			'<th>Function</th>' +

			'<th>Enterer</th>' +

			'<th>Entry Time</th>' +

			'<th>Authorizer</th>' +

			'<th>Field Name</th>' +

			'<th>Old Value</th>' +

			'<th>New Value</th>' +

			'<th>Remarks</th>' +

			'</tr>';

		var columnTitles = ["Audit Date", "Table Name", "Function", "Enterer", "Entry Time", "Authorizer", "Field Name", "Old Value", "New Value", "Remarks"];

		function buildFilterHeaderHtml() {

			var html = '<tr id="filterHeaderRow">';

			columnTitles.forEach(function (title, idx) {

				html += '<th style="padding:3px !important;background-color:#414D59;color:black" class="inputcolors">' +

					'<input  type="text" style="border:2px solid black;background-color:white;color:black" class="form-control form-control-sm col-search" ' +

					'data-col="' + idx + '" placeholder="' + title + '">' +

					'</th>';

			});

			html += '</tr>';

			return html;

		}

		function initTable() {

			table = $('#usertable').DataTable({

				destroy: true,

				paging: false,

				ordering: false,

				searching: true,

				info: false,

				lengthChange: false,

				scrollY: "calc(100vh - 290px)",

				scrollCollapse: true,

				scrollX: false,

				autoWidth: false,

				deferRender: true,

				dom: "lrt",

				columnDefs: [

					{width: "8%", targets: 0},

					{width: "10%", targets: 1},

					{width: "12%", targets: 2},

					{width: "10%", targets: 3},

					{width: "10%", targets: 4},

					{width: "10%", targets: 5},

					{width: "10%", targets: 6},

					{width: "10%", targets: 7},

					{width: "10%", targets: 8},

					{width: "10%", targets: 9}

				],

				initComplete: function () {

					this.api().columns.adjust();

				},

				drawCallback: function () {

					this.api().columns.adjust();

				}

			});

			// Re-adjust columns on window resize/zoom to fix misalignment

			$(window).off('resize.adjust').on('resize.adjust', function () {

				if (table) {

					table.columns.adjust();

				}

			});

		}

		initTable();

		$('#btnToggleFilter').on('click', function () {

			var savedSearches = {};

			if (filterActive) {

				$('#usertable_wrapper .col-search').each(function () {

					savedSearches[$(this).data('col')] = $(this).val();

				});

			}

			table.destroy();

			if (!filterActive) {

				$('#usertable thead').html(buildFilterHeaderHtml());

				filterActive = true;

			} else {

				$('#usertable thead').html(normalHeaderHtml);

				filterActive = false;

			}

			initTable();

			if (filterActive) {

				Object.keys(savedSearches).forEach(function (colIdx) {

					if (savedSearches[colIdx]) {

						table.column(colIdx).search(savedSearches[colIdx]);

						$('#usertable_wrapper .col-search[data-col="' + colIdx + '"]').val(savedSearches[colIdx]);

					}

				});

				table.draw();

			}

			if (table) {

				table.columns.adjust();

			}

		});

		var searchTimeout;

		$(document).on('keyup change', '#usertable_wrapper .col-search', function () {

			var colIdx = $(this).data('col');

			var val = this.value;

			clearTimeout(searchTimeout);

			searchTimeout = setTimeout(function () {

				table.column(colIdx).search(val).draw();

				if (table) {

					table.columns.adjust();

				}

			}, 300);

		});

		$(document).on('click', '#usertable_wrapper .col-search', function (e) {

			e.stopPropagation();

		});

	});

</script>
