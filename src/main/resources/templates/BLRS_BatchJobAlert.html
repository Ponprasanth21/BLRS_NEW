<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- BAJ VERSION 1.0.1 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BLRS</title>
    <link rel="stylesheet" type="text/css" href="/webjars/bootstrap/4.3.1/css/bootstrap.min.css" th:href="@{/webjars/bootstrap/4.3.1/css/bootstrap.min.css}">
    <link rel="stylesheet" type="text/css" href="/webjars/font-awesome/5.9.0/css/all.min.css" th:href="@{/webjars/font-awesome/5.9.0/css/all.min.css}">
    <link rel="stylesheet" type="text/css" href="/webjars/jquery-ui/1.12.1/jquery-ui.min.css" th:href="@{/webjars/jquery-ui/1.12.1/jquery-ui.min.css}">
    <link rel="stylesheet" type="text/css" href="/webjars/datatables/1.10.19/css/jquery.dataTables.min.css" th:href="@{/webjars/datatables/1.10.19/css/jquery.dataTables.min.css}">
    <script src="/webjars/jquery/3.4.1/jquery.min.js" th:src="@{/webjars/jquery/3.4.1/jquery.min.js}"></script>
    <script src="/webjars/jquery-ui/1.12.1/jquery-ui.min.js" th:src="@{/webjars/jquery-ui/1.12.1/jquery-ui.min.js}"></script>
    <script src="/webjars/popper.js/1.14.7/umd/popper.min.js" th:src="@{/webjars/popper.js/1.14.7/umd/popper.min.js}"></script>
    <script src="/webjars/bootstrap/4.3.1/js/bootstrap.min.js" th:src="@{/webjars/bootstrap/4.3.1/js/bootstrap.min.js}"></script>
    <script src="/webjars/datatables/1.10.19/js/jquery.dataTables.min.js" th:src="@{/webjars/datatables/1.10.19/js/jquery.dataTables.min.js}"></script>
    <script src="/webjars/datatables/1.10.19/js/dataTables.bootstrap4.min.js" th:src="@{/webjars/datatables/1.10.19/js/dataTables.bootstrap4.min.js}"></script>
    <link rel="stylesheet" type="text/css" href="/webjars/chartjs/2.8.0/Chart.min.css" th:href="@{/webjars/chartjs/2.8.0/Chart.min.css}">
    <script src="/webjars/chartjs/2.8.0/Chart.min.js" th:src="@{/webjars/chartjs/2.8.0/Chart.min.js}"></script>
    <link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">

    <style>
       

		
				@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
				body {
					background-color: #f8fafc !important;
					font-family: 'Outfit', sans-serif !important;
					color: #1e293b;
				}
				.container-manager {
					width: 100%;
					max-width: 100%;
					padding-right: 6%;
					padding-left: 6%;
					margin-right: auto;
					margin-left: auto;
					margin-top: 10px;
				}
				.table-card {
					background: #ffffff;
					border: 1px solid rgba(226, 232, 240, 0.8);
					border-radius: 12px;
					padding: 20px;
					box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
					height: 100%;
				}
				.custom-table {
					width: 100%;
					border-collapse: separate;
					border-spacing: 0;
					margin-bottom: 0;
				}
				.custom-table th {
					background: #f8fafc;
					color: #64748b;
					font-size: 0.72rem;
					font-weight: 600;
					text-transform: uppercase;
					letter-spacing: 0.05em;
					padding: 10px 14px;
					border-bottom: 1px solid #e2e8f0;
					border-top: none;
				}
				.custom-table td {
					padding: 10px 14px;
					border-bottom: 1px solid #f1f5f9;
					color: #475569;
					font-size: 0.82rem;
					vertical-align: middle;
				}
				.custom-table tr:hover td { background-color: #f8fafc; }
				.custom-table tr:last-child td { border-bottom: none; }
				.status-badge {
					display: inline-flex;
					align-items: center;
					padding: 2px 8px;
					border-radius: 9999px;
					font-size: 0.72rem;
					font-weight: 600;
				}
				.status-success { background-color: #d1fae5; color: #065f46; }
				.status-warning { background-color: #fef3c7; color: #92400e; }
				.status-danger { background-color: #fee2e2; color: #991b1b; }
				.status-info { background-color: #e0f2fe; color: #075985; }
				.table-responsive::-webkit-scrollbar { width: 6px; height: 6px; }
				.table-responsive::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
				.table-responsive::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
				@media (max-width: 767.98px) {
					.container-manager {
						width: 100%;
						max-width: 100%;
						padding-right: 10px;
						padding-left: 10px;
						margin-top: 25px;
					}
					.container-manager > .row,
					.container-manager .col-sm-11,
					.container-manager .card {
						width: 100%;
						margin-left: 0;
						margin-right: 0;
					}
					.container-manager .card-body {
						padding-left: 15px !important;
						padding-right: 15px !important;
					}
					.container-manager form { max-width: 100% !important; }
					.container-manager fieldset {
						max-width: 100% !important;
						padding-left: 12px !important;
						padding-right: 12px !important;
					}
				}
				@media (max-width: 575.98px) {
					.container-manager { padding-right: 5px; padding-left: 5px; }
					.container-manager .card-footer { padding-left: 5px; padding-right: 5px; }
				}
				html, body {
				    width: 100% !important;
				    margin: 0 !important;
				    overflow-x: hidden !important;
				    overflow-y: visible !important;
				}
			</style>
			<script th:inline="javascript">
				/*<![CDATA[*/
				function home() {
					location.href = './Dashboard';
				}
				function Back() {
					window.history.back();
				}
				/*]]>*/
			</script>
		</head>

		<body>
			<div th:insert="BLRS_HeaderMenu :: header"></div>
			<div class="container-manager">
				<div class="row d-flex justify-content-center">
					<div class="col-sm-11 mt-2">
						<div th:if="${formmode}=='list'">
							<div class="panel panel-primary filterable">
								<div class="card" style="box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border-radius: 6px; border: 1px solid #cbd5e1;">
									<div class="card-header" style="background-color: #e9ecef;">
										<div class="float-left">
											<h6 style="font-weight: bold; margin: 0;">Batch Job Alert</h6>
										</div>
									</div>
									<div class="card-body" style="padding: 12px 25px; border-top: 1px solid #cbd5e1; border-bottom: 1px solid #cbd5e1;">
										<div class="table-responsive">
											<table class="custom-table" id="alertTable">
												<thead>
													<tr>
														<th>Job Name</th>
														<th>Job Type</th>
														<th>Scheme Code</th>
														<th>Periodicity</th>
														<th>Last Run Date</th>
														<th>Next Run Date</th>
														<th>Job Status</th>
													</tr>
												</thead>
												<tbody>
													<tr th:if="${#lists.isEmpty(AlertList)}">
														<td colspan="7" class="text-center text-muted">No batch jobs are due today.</td>
													</tr>
													<tr th:each="job : ${AlertList}">
														<td th:text="${job.job_name}"></td>
														<td th:text="${job.job_type}"></td>
														<td th:text="${job.schm_code}" style="max-width: 320px; word-break: break-word;"></td>
														<td th:text="${job.periodicity}"></td>
														<td th:text="${job.last_run_date != null} ? ${#dates.format(job.last_run_date, 'dd-MM-yyyy')} : ''"></td>
														<td th:text="${job.next_run_date != null} ? ${#dates.format(job.next_run_date, 'dd-MM-yyyy')} : ''"></td>
														<td>
															<span th:if="${job.job_status == 'COMPLETED'}" class="status-badge status-success">COMPLETED</span>
															<span th:if="${job.job_status == 'FAILED'}" class="status-badge status-danger">FAILED</span>
															<button type="button" class="btn btn-sm btn-primary btnRun"
																th:if="${job.job_status != 'COMPLETED'}" th:attr="data-jobid=${job.job_id}">Run</button>
														</td>
													</tr>
												</tbody>
											</table>
										</div>
									</div>
									<div class="card-footer text-center border-top-0" style="background-color: #e9ecef;">
										<button type="button" class="btn-primary big-btn" id="btnHome" onclick="home();">Home</button>
										<button type="button" class="btn-primary big-btn" id="btnBack" onclick="Back();">Back</button>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			<script>
				$(function () {
					$(".btnRun").on("click", function () {
						var btn = $(this);
						btn.prop("disabled", true).text("Running...");
						$.ajax({
							url: "runBatchJob",
							type: "POST",
							data: { job_id: btn.data("jobid") },
							success: function (res) { alert(res); location.reload(); },
							error: function () { alert("Batch job could not be run."); btn.prop("disabled", false).text("Run"); }
						});
					});
				});
			</script>
		</body>
		</html>
