<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
	<!-- BAJ VERSION 1.0.1  -->
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>BLRS</title>

	<link rel="stylesheet" type="text/css" href="/webjars/bootstrap/4.3.1/css/bootstrap.min.css"
		th:href="@{/webjars/bootstrap/4.3.1/css/bootstrap.min.css}">
	<link rel="stylesheet" type="text/css" href="/webjars/font-awesome/5.9.0/css/all.min.css"
		th:href="@{/webjars/font-awesome/5.9.0/css/all.min.css}">
	<link rel="stylesheet" type="text/css" href="/webjars/jquery-ui/1.12.1/jquery-ui.min.css"
		th:href="@{/webjars/jquery-ui/1.12.1/jquery-ui.min.css}">
	<link rel="stylesheet" type="text/css" href="/webjars/datatables/1.10.19/css/jquery.dataTables.min.css"
		th:href="@{/webjars/datatables/1.10.19/css/jquery.dataTables.min.css}">

	<script src="/webjars/jquery/3.4.1/jquery.min.js" th:src="@{/webjars/jquery/3.4.1/jquery.min.js}"></script>
	<script src="/webjars/jquery-ui/1.12.1/jquery-ui.min.js"
		th:src="@{/webjars/jquery-ui/1.12.1/jquery-ui.min.js}"></script>
	<script src="/webjars/popper.js/1.14.7/umd/popper.min.js"
		th:src="@{/webjars/popper.js/1.14.7/umd/popper.min.js}"></script>
	<script src="/webjars/bootstrap/4.3.1/js/bootstrap.min.js"
		th:src="@{/webjars/bootstrap/4.3.1/js/bootstrap.min.js}"></script>
	<script src="/webjars/datatables/1.10.19/js/jquery.dataTables.min.js"
		th:src="@{/webjars/datatables/1.10.19/js/jquery.dataTables.min.js}"></script>
	<script src="/webjars/datatables/1.10.19/js/dataTables.bootstrap4.min.js"
		th:src="@{/webjars/datatables/1.10.19/js/dataTables.bootstrap4.min.js}"></script>

	<link rel="stylesheet" type="text/css" href="/webjars/chartjs/2.8.0/Chart.min.css"
		th:href="@{/webjars/chartjs/2.8.0/Chart.min.css}">
	<script src="/webjars/chartjs/2.8.0/Chart.min.js" th:src="@{/webjars/chartjs/2.8.0/Chart.min.js}"></script>

	<link rel="shortcut icon" th:href="@{/favicon.ico}" type="image/x-icon">
	<link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">

	<style>
			@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

			body {
				background-color: #f8fafc !important;
				font-family: 'Outfit', sans-serif !important;
				color: #1e293b;
			}

			

			.container-manager {
				width: 83.5%;
				padding-right: 15px;
				padding-left: 15px;
				margin-right: auto;
				margin-left: 16% !important;
				margin-top: 80px;
			}

			/* =========================================================
			   GUARANTOR REPORT
			   ========================================================= */

			.guarantor-body {
			    min-height: 300px;
			    background-color: #f4f4f4;
			    border: 1px solid #ddd;
			    padding: 45px 20px;
			}

			.guarantor-form {
			    width: 450px;
			    margin: 0 auto;
			}

			.form-row-custom {
			    display: flex;
			    align-items: center;
			    margin-bottom: 14px;
			}

			.form-row-custom label {
			    width: 130px;
			    margin-bottom: 0;
			    color: #333;
			    font-size: 13px;
			    font-weight: 500;
			}

			.report-select {
			    width: 180px;
			    height: 27px;
			    padding: 2px 8px;
			    font-size: 12px;
			    color: #333;
			    border: 1px solid #999;
			    border-radius: 3px;
			    background-color: #fff;
			}

			.guarantor-footer {
			    background-color: #e9ecef;
			    border-top: 0;
			    text-align: center;
			    padding: 12px;
			}

			.guarantor-footer .big-btn {
			    min-width: 48px;
			    margin: 0 3px;
			    padding: 4px 10px;
			    font-size: 12px;
			}
		</style>

		<script>
			function generateReport() {
			    alert("Report generated successfully!");
			}
			</script>


</head>

<body>
	<div th:insert="BLRS_HeaderMenu :: header"></div>

	<div class="container-manager">
		<div class="row d-flex justify-content-center">
			<div class="col-sm-11 mt-2">

				<div th:if="${formmode}=='list'">
					<div class="panel panel-primary filterable">
						<div class="card">
							<div class="card">

							    <!-- Header -->
							    <div class="card-header" style="background-color: #e9ecef">
							        <div class="float-left">
							            <h6>List of Guarantor Report</h6>
							        </div>
							    </div>

							    <!-- Body -->
							    <div class="card-body guarantor-body">

							        <div class="guarantor-form">

							            <!-- Month -->
							            <div class="form-row-custom">

							                <label for="month">
							                    Month
							                </label>

							                <select id="month"
							                        name="month"
							                        class="form-control report-select">

							                    <option value="01">January</option>
							                    <option value="02">February</option>
							                    <option value="03">March</option>
							                    <option value="04">April</option>
							                    <option value="05">May</option>
							                    <option value="06">June</option>
							                    <option value="07">July</option>
							                    <option value="08">August</option>
							                    <option value="09">September</option>
							                    <option value="10">October</option>
							                    <option value="11">November</option>
							                    <option value="12">December</option>

							                </select>

							            </div>


							            <!-- Year -->
							            <div class="form-row-custom">

							                <label for="year">
							                    Year
							                </label>

							                <select id="year"
							                        name="year"
							                        class="form-control report-select">

							                    <option th:each="year : ${#numbers.sequence(2000, T(java.time.Year).now().getValue())}"
							                            th:value="${year}"
							                            th:text="${year}"
							                            th:selected="${year == T(java.time.Year).now().getValue()}">
							                    </option>

							                </select>

							            </div>


							            <!-- Reminder Type -->
							            <div class="form-row-custom">

							                <label for="reminderType">
							                    Reminder Type
							                </label>

							                <select id="reminderType"
							                        name="reminderType"
							                        class="form-control report-select">

							                    <option value="">Select</option>

							                    <option value="FIRST">First Reminder</option>
							                    <option value="SECOND">Second Reminder</option>
							                    <option value="FINAL">Final Reminder</option>

							                </select>

							            </div>


							            <!-- Scheme Code -->
							            <div class="form-row-custom">

							                <label for="schemeCode">
							                    Scheme Code
							                </label>

							                <select id="schemeCode"
							                        name="schemeCode"
							                        class="form-control report-select">

							                    <option value="">Select</option>

							                    <option th:each="scheme : ${schemeList}"
							                            th:value="${scheme}"
							                            th:text="${scheme}">
							                    </option>

							                </select>

							            </div>


							            <!-- Department -->
							            <div class="form-row-custom">

							                <label for="department">
							                    Department
							                </label>

							                <select id="department"
							                        name="department"
							                        class="form-control report-select">

							                    <option value="">All</option>

							                    <option th:each="department : ${departmentList}"
							                            th:value="${department}"
							                            th:text="${department}">
							                    </option>

							                </select> 

							            </div>

							        </div>

							    </div>


							    <!-- Footer -->
							    <div class="card-footer guarantor-footer">

							        <button type="button"
							                class="btn-primary big-btn"
							                id="btnHome"
							                onclick="window.location.href='/BLRS/Dashboard';">
							            Home
							        </button>

							        <button type="button"
							                class="btn-primary big-btn"
							                id="btnGenerate"
							                onclick="generateReport();">
							            Generate
							        </button>

							        <button type="button"
							                class="btn-primary big-btn"
							                id="btnBack"
							                onclick="window.history.back();">
							            Back
							        </button>

							    </div>

							</div>

					</div>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
